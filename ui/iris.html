<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris for Claude Code</title>
<style>
:root{
  --paper:#EFF2F7; --surface:#fff; --well:#F7F9FC; --sunk:#EDF1F7;
  --ink:#131826; --ink2:#59637A; --ink3:#8B95AA;
  --line:#E1E6EF; --line2:#CDD5E2;
  --wire:#1B4DFF; --wire-soft:#E8EDFF;
  --jade:#07785E; --jade-soft:#E1F4EE;
  --amber:#A75A06; --amber-soft:#FDF0DF;
  --rust:#BB332A; --rust-soft:#FCE9E7;
  --violet:#6435DE; --violet-soft:#EFEAFE;
  --sys:var(--wire); --too:#D08700; --his:var(--violet);
  --ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-lg:14px;
  --sh-1:0 1px 2px rgba(19,24,38,.05);
  --sh-2:0 1px 3px rgba(19,24,38,.07),0 6px 18px -6px rgba(19,24,38,.10);
  --sh-3:0 12px 40px -8px rgba(19,24,38,.20),0 2px 8px rgba(19,24,38,.08);
  --rail:238px; --top:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);font-size:15.5px;line-height:1.58;
  -webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;height:100dvh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--wire);outline-offset:2px;border-radius:4px}
::selection{background:var(--wire);color:#fff}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--mono)}

/* ── scrollbars ─────────────────────────────── */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#C9D1E0;border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#AEB9CD;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ── topbar ─────────────────────────────────── */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:17px}
.brand-mark{width:29px;height:29px;flex:none}
.env{display:flex;align-items:center;gap:7px;height:32px;padding:0 9px 0 10px;border:1px solid var(--line2);
  border-radius:8px;background:var(--well);font-size:13.5px;font-weight:600;color:var(--ink2)}
.env:hover{border-color:var(--ink3)}
.pulse{width:7px;height:7px;border-radius:99px;background:var(--jade);position:relative}
.pulse::after{content:"";position:absolute;inset:-3px;border-radius:99px;background:var(--jade);opacity:.25;animation:pulse 2.4s ease-out infinite}
/* proxy stream is down — stop pretending anything is arriving */
.pulse.off{background:var(--rust)}
.pulse.off::after{background:var(--rust);animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(.6);opacity:.35}100%{transform:scale(1.9);opacity:0}}
.spacer{flex:1}
.ksearch{display:flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 12px;min-width:250px;
  border:1px solid var(--line2);border-radius:8px;background:var(--well);color:var(--ink3);font-size:14px}
.ksearch:hover{border-color:var(--ink3);color:var(--ink2)}
.top #twin{flex:none}
.top #twin button{padding:5px 10px;font-size:12.5px;white-space:nowrap}
kbd{font-family:var(--mono);font-size:11.5px;padding:2px 5px;border:1px solid var(--line2);border-radius:5px;
  background:#fff;color:var(--ink3);line-height:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;
  border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600;transition:.14s}
.btn:hover{border-color:var(--ink3);background:var(--well)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#242C40}
.btn.pri:disabled{opacity:.4;cursor:not-allowed}
.btn .cnt{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.22);padding:1px 5px;border-radius:5px}

/* ── shell ──────────────────────────────────── */
.shell{position:fixed;inset:var(--top) 0 0 0;display:flex}
.rail{width:var(--rail);flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 12px;gap:2px;z-index:40;overflow-y:auto}
.rail-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  padding:6px 10px 8px}
.nav{display:flex;align-items:flex-start;gap:11px;width:100%;padding:9px 10px;border-radius:10px;
  color:var(--ink2);position:relative;transition:.14s;text-align:left}
.nav svg{flex:none;margin-top:2px}
.nav .lab{display:block;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3}
.nav .lab-m{display:none}
.nav .des{display:block;font-size:12.5px;color:var(--ink3);line-height:1.35;margin-top:2px}
.nav:hover{background:var(--sunk)}
.nav[aria-current="page"]{background:var(--wire-soft);color:var(--wire)}
.nav[aria-current="page"] .lab{color:var(--wire)}
.nav[aria-current="page"] .des{color:#5B7BE8}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;
  border-radius:0 3px 3px 0;background:var(--wire)}
.nav .kb{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--well);flex:none;margin-top:2px}
.reset-link{margin-top:8px;padding:0;font-size:12px;font-weight:500;color:var(--ink3);
  text-decoration:underline;text-underline-offset:2px;transition:color .14s}
.reset-link:hover{color:var(--rust)}
.ctabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ctab{display:flex;flex-direction:column;gap:2px;padding:9px 14px 10px;border-radius:8px 8px 0 0;
  color:var(--ink2);position:relative;text-align:left;transition:.14s}
.ctab:hover{background:var(--sunk);color:var(--ink)}
.ctab b{font-size:13.5px;font-weight:600;color:inherit;white-space:nowrap}
.ctab span{font-family:var(--mono);font-size:11.5px;color:var(--ink3);white-space:nowrap}
.ctab[aria-selected="true"]{background:var(--wire-soft);color:var(--wire)}
.ctab[aria-selected="true"] span{color:var(--wire);opacity:.75}
.ctab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--wire)}
.linkish{font-size:12px;font-weight:600;color:var(--wire);text-decoration:underline;text-underline-offset:2px;padding:0 0 0 4px}
.linkish:hover{opacity:.75}
@media(max-width:760px){.ctabs{overflow-x:auto;flex-wrap:nowrap}.ctab{flex:none}}
.rail-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);line-height:1.45}
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.wrap{max-width:1420px;margin:0 auto;padding:22px 26px 90px}

/* ── page head ──────────────────────────────── */
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
h1{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.sub{color:var(--ink2);font-size:15px;margin-top:5px;max-width:62ch;text-wrap:balance}

/* ── cards ──────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.chead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ctitle{font-size:15px;font-weight:700;letter-spacing:-.01em}
.cnote{font-size:13px;color:var(--ink3)}
.cbody{padding:16px}
.grid{display:grid;gap:14px}

/* ── kpi ────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;box-shadow:var(--sh-1);
  position:relative;overflow:hidden}
.kpi .lbl{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kpi .val{font-family:var(--mono);font-size:29px;font-weight:600;letter-spacing:-.035em;margin-top:7px;line-height:1}
.kpi .foot{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:13px;color:var(--ink2)}
.kpi .spark{position:absolute;right:0;bottom:0;opacity:.5}
.delta{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:1.5px 6px;border-radius:6px}
.delta.up{background:var(--rust-soft);color:var(--rust)}
.delta.dn{background:var(--jade-soft);color:var(--jade)}
.delta.flat{background:var(--sunk);color:var(--ink2)}

/* ── SIGNATURE: context ribbon + prefix magnifier ── */
.rib-stage{padding:0 18px}
.rib-mag{display:flex;height:54px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;
  overflow:hidden;background:var(--sunk);cursor:crosshair}
.rib-mag .seg{border-right:1px solid rgba(255,255,255,.28)}
.rib-mag .seg:last-child{border-right:0}
.rib-mag .cap{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:600;
  color:#fff;letter-spacing:.01em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.28);
  max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis;text-transform:none}
.rib-mag .cap i{display:block;font-style:normal;font-family:var(--mono);font-size:11px;opacity:.8;font-weight:400;margin-top:1px}
.rib-link{display:block;width:100%;height:22px;overflow:visible}
.rib-caption{display:flex;align-items:center;gap:8px;padding:9px 0 7px;font-size:12px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.rib-caption::after{content:"";flex:1;height:1px;background:var(--line)}
/* ── SIGNATURE: context ribbon ──────────────── */
.ribbon-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.ribbon-top{display:flex;align-items:center;gap:14px;padding:14px 18px 12px;flex-wrap:wrap}
.ribbon-legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:500}
.sw{width:9px;height:9px;border-radius:3px}
.ribbon{position:relative;height:78px;border-radius:9px;overflow:hidden;background:var(--sunk);
  display:flex;cursor:crosshair;border:1px solid var(--line)}
.seg{position:relative;height:100%;transition:filter .12s;min-width:1px}
.seg:hover{filter:brightness(1.14) saturate(1.2)}
.seg.sys{background:linear-gradient(180deg,#3D66FF,#1B4DFF)}
.seg.too{background:linear-gradient(180deg,#EDA31C,#D08700)}
.seg.his{background:linear-gradient(180deg,#8460F0,#6435DE)}
.seg.his.alt{background:linear-gradient(180deg,#9B7CF3,#7A50E6)}
.ribbon .seg .cap{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.04em;
  text-transform:uppercase;opacity:.92;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.ribbon .seg .cap i{display:block;font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:-.02em;
  text-transform:none;font-weight:500;opacity:.85;margin-top:2px}
.prefix-lens{position:absolute;top:0;bottom:0;left:0;background:rgba(255,255,255,.16);
  border-right:1px solid rgba(255,255,255,.6);pointer-events:none;z-index:2}
.notch{position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,#fff 0 4px,transparent 4px 8px);
  z-index:3;pointer-events:none}
.notch::after{content:"⌷";position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:9px;color:#fff}
.ribbon-scale{display:flex;justify-content:space-between;margin:8px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.ribbon-foot{display:flex;align-items:center;gap:9px;padding:11px 18px 15px;border-top:1px solid var(--line);margin-top:13px;flex-wrap:wrap}
#ribTip{font-size:14px;color:var(--ink2);min-height:19px}
#ribTip b{color:var(--ink);font-weight:600}
#ribTip .k{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1.5px 6px;border-radius:5px;margin-left:6px}

/* ── bars / charts ──────────────────────────── */
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px}
.bar{flex:1;position:relative;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#4F76FF,#1B4DFF);
  min-height:3px;transition:.18s;cursor:pointer}
.bar:hover{filter:brightness(1.16)}
.bar.sel{outline:2px solid var(--ink);outline-offset:1px}
.xaxis{display:flex;gap:5px;margin-top:7px}
.xaxis span{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* ── tables ─────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{position:sticky;top:0;background:var(--well);z-index:2;text-align:left;font-size:11.5px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line)}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--well)}
.tbl tbody tr.sel{background:var(--wire-soft)}
.tbl tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
.tbl-scroll{max-height:none;overflow:auto;border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ── chips / tags ───────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;
  border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--jade-soft);color:var(--jade)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--rust-soft);color:var(--rust)}
.tag.wire{background:var(--wire-soft);color:var(--wire)}
.tag.vio{background:var(--violet-soft);color:var(--violet)}
.tag.mono{font-family:var(--mono);font-weight:500;letter-spacing:-.01em}
.dot-s{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}

/* ── toggle ─────────────────────────────────── */
.tog{width:40px;height:23px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:.18s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:99px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s cubic-bezier(.3,1.4,.6,1)}
.tog[aria-checked="true"]{background:var(--jade)}
.tog[aria-checked="true"]::after{transform:translateX(17px)}
.tog.pend{background:var(--amber)}
.tog:disabled{opacity:.45;cursor:not-allowed}

/* ── segmented ──────────────────────────────── */
.segd{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.segd button{padding:7px 15px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:.14s}
.segd button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}

/* ── waterfall ──────────────────────────────── */
.wf{position:relative;height:24px;background:var(--sunk);border-radius:5px;overflow:hidden;min-width:110px}
.wf i{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#5B7EFF,#1B4DFF)}
.wf i.slow{background:linear-gradient(90deg,#E08A2B,#B45309)}
.wf i.vslow{background:linear-gradient(90deg,#D9564A,#BB332A)}
.wf b{position:absolute;right:7px;top:0;line-height:24px;font-family:var(--mono);font-size:12px;color:var(--ink2);font-weight:500}

/* ── stack meter ────────────────────────────── */
.stack{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:1px}
.stack i{display:block}

/* ── drawer ─────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(19,24,38,.28);backdrop-filter:blur(2px);z-index:80;opacity:0;
  pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);background:var(--paper);z-index:90;
  box-shadow:var(--sh-3);transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.9,.35,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px}
.dbody{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:12px}
/* Cards keep their natural height and the drawer scrolls. Without this the
   flex column shrinks them to fit — and because .acc/.msg clip overflow, the
   squashed ones lose their own header text. */
.dbody>*{flex:0 0 auto}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.x:hover{background:var(--sunk);color:var(--ink)}

/* ── accordion ──────────────────────────────── */
.acc{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.ahead{display:flex;align-items:center;gap:9px;padding:13px 15px;width:100%;text-align:left;font-size:14px;font-weight:700}
.ahead:hover{background:var(--well)}
.caret{width:14px;height:14px;flex:none;color:var(--ink3);transition:transform .18s}
.acc.open .caret{transform:rotate(90deg)}
.abody{display:none;padding:0 13px 13px;border-top:1px solid var(--line)}
.acc.open .abody{display:block}
.pre{font-family:var(--mono);font-size:12.5px;line-height:1.65;background:var(--well);border:1px solid var(--line);
  border-radius:8px;padding:11px;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;color:#2A3244}

/* ── message timeline ───────────────────────── */
.msg{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;margin-top:8px}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--well);border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.mhead .n{font-family:var(--mono);color:var(--ink3);text-transform:none;letter-spacing:0;font-weight:500}
.blk{padding:11px 13px;border-bottom:1px dashed var(--line);font-size:13.5px}
.blk:last-child{border-bottom:0}
.btype{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;display:flex;gap:7px;align-items:center}
.btxt{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#2A3244;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
.blk.think{background:#FBFAFF}
.blk.think .btxt{color:var(--violet);font-style:italic}
.blk.err{background:var(--rust-soft)}

/* ── trace ──────────────────────────────────── */
.trace{position:relative;padding-left:30px}
.trace::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tr{position:relative;display:flex;gap:11px;padding:9px 0;align-items:flex-start}
.tr::before{content:"";position:absolute;left:-24px;top:15px;width:9px;height:9px;border-radius:99px;
  background:#fff;border:2px solid var(--line2);z-index:1}
.tr.w::before{border-color:var(--amber);background:var(--amber-soft)}
.tr.d::before{border-color:var(--rust);background:var(--rust-soft)}
.tr .i{font-family:var(--mono);font-size:12px;color:var(--ink3);width:22px;flex:none;padding-top:3px;text-align:right}
.tr .body{flex:1;min-width:0}
.tr .cmd{font-family:var(--mono);font-size:12.5px;color:var(--ink2);background:var(--well);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* One action, one line. A 140-char description in a wrapping flex row was making
   every row two or three lines tall, which is what stopped the trace scaling. */
.tr .hd{display:flex;align-items:baseline;gap:8px;min-width:0}
.tr .hd b{flex:none}
.tr .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}

/* ── cmdk ───────────────────────────────────── */
.cmdk{position:fixed;inset:0;z-index:100;display:none;padding-top:12vh;justify-content:center;

@keyframes pop{from{transform:scale(.97) translateY(-6px);opacity:0}}
.cmdk input{width:100%;border:0;padding:18px 20px;font-size:16.5px;border-bottom:1px solid var(--line);outline:0}

.ci[data-a="1"]{background:var(--wire-soft);color:var(--wire)}
.ci .hint{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)}

/* ── toast ──────────────────────────────────── */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:12px 17px;border-radius:10px;
  font-size:14px;font-weight:500;box-shadow:var(--sh-3);animation:rise .22s cubic-bezier(.3,1.3,.6,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.toast .ok{color:#6EE7B7}

/* ── misc ───────────────────────────────────── */
.empty{padding:40px 20px;text-align:center;color:var(--ink3);font-size:14px}
.hr{height:1px;background:var(--line);margin:2px 0}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.risk-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.risk-row:last-child{border-bottom:0}
.ricon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px}
.sim{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--jade-soft);border:1px solid #BFE6DA;
  border-radius:var(--r);font-size:13px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Grid items default to min-width:auto, so a wide child (a 100-bar chart and
   its axis labels) refuses to shrink and blows the column — and its sibling —
   off screen. Every split column must be allowed to shrink. */
.split>*{min-width:0}
.bars,.xaxis{overflow:hidden}
.xaxis-ends{display:flex;justify-content:space-between;margin-top:7px;
  font-family:var(--mono);font-size:11px;color:var(--ink3)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink2)}
.kv b{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}

<script>
/* ══════════════════════════════════════════════════════════════════════════
   LIVE DATA — Iris is fed by .claude/proxy.mjs, not by a baked snapshot.

     GET  /__meta       what this proxy is recording (repo, port, session)
     GET  /__config     the deny list in .claude/settings.json (authoritative)
     POST /__config     {tool, denied} — what the Publish button writes
     GET  /__tooldocs   full tool schemas captured off the wire
     GET  /__events     SSE of every request/response, replayed on connect

   DATA keeps the exact shape the views below expect. Its arrays are mutated in
   place and never reassigned, because the render code aliases them directly
   (const C=DATA.calls, TOOLS=DATA.tools, …).
   ══════════════════════════════════════════════════════════════════════════ */
const DATA={
  deny:[], calls:[], tools:[], trace:[], docs:{},
  meta:{session:'…', repo:'workspace', agent:'Claude Code', model:'—',
        pricing:{in:0,out:0,cw5:0,cw1:0,cr:0,tier:null,note:null}, start:null, end:null},
};
/* Time-windowed calls (live capture + spend ledger). Filled in recalc(). */
const VW=[];
const LIVE={
  connected:false, port:null, upstream:null, settingsPath:null,
  denySet:new Set(), docTok:{}, wireDesc:{}, seen:0, skipped:0, lastEventAt:null,
  authRequired:false,
};
const GUARD={ env:null, proposal:null, decisions:[], signals:[], stats:{allow:0,ask:0,deny:0} };
function refreshGuard(){
  return fetch('/__authority').then(r=>r.json()).then(d=>{
    GUARD.env=d.envelope||null;
    GUARD.proposal=d.proposal||null;
    GUARD.signals=d.signals||[];
  }).catch(()=>{}).then(()=>
    fetch('/__decisions').then(r=>r.json()).then(d=>{
      GUARD.decisions=d.decisions||[];
      GUARD.stats={allow:0,ask:0,deny:0};
      for(const x of GUARD.decisions){
        const k=String(x.decision||'').toLowerCase();
        if(k==='allow') GUARD.stats.allow++;
        else if(k==='ask') GUARD.stats.ask++;
        else if(k==='deny') GUARD.stats.deny++;
      }
    }).catch(()=>{})
  );
}

/* ── Price book ─────────────────────────────────────────────────────────────
   Anthropic list prices, USD per 1M tokens. Verified 2026-07-27 against
   platform.claude.com/docs/en/docs/about-claude/pricing

     in  base input        cr   cache hit / refresh  (0.1x input)
     cw5 5-minute write    (1.25x input)
     cw1 1-hour write      (2x input)   ← Claude Code uses this TTL, and it is
     out output                           NOT the same price as a 5m write

   Matched longest-id-first against the model on the wire, so a new generation can
   never silently inherit the previous one's prices — an unknown id is reported as
   unpriced instead of being guessed at. Long context needs no tier: Claude 4.6 and
   later bill the full 1M window at standard rates. */
const PRICE_BOOK=[
  {id:'claude-fable-5',    label:'Fable 5',    in:10,  cw5:12.50, cw1:20,   cr:1,    out:50},
  {id:'claude-mythos-5',   label:'Mythos 5',   in:10,  cw5:12.50, cw1:20,   cr:1,    out:50},
  {id:'claude-opus-5',     label:'Opus 5',     in:5,   cw5:6.25,  cw1:10,   cr:0.50, out:25},
  {id:'claude-opus-4-8',   label:'Opus 4.8',   in:5,   cw5:6.25,  cw1:10,   cr:0.50, out:25},
  {id:'claude-opus-4-7',   label:'Opus 4.7',   in:5,   cw5:6.25,  cw1:10,   cr:0.50, out:25},
  {id:'claude-opus-4-6',   label:'Opus 4.6',   in:5,   cw5:6.25,  cw1:10,   cr:0.50, out:25},
  {id:'claude-opus-4-5',   label:'Opus 4.5',   in:5,   cw5:6.25,  cw1:10,   cr:0.50, out:25},
  {id:'claude-opus-4-1',   label:'Opus 4.1',   in:15,  cw5:18.75, cw1:30,   cr:1.50, out:75},
  {id:'claude-opus-4',     label:'Opus 4',     in:15,  cw5:18.75, cw1:30,   cr:1.50, out:75},
  /* Sonnet 5 runs at introductory pricing through 2026-08-31, then steps up. */
  {id:'claude-sonnet-5',   label:'Sonnet 5',   in:2,   cw5:2.50,  cw1:4,    cr:0.20, out:10,
     until:'2026-09-01T00:00:00Z', after:{in:3, cw5:3.75, cw1:6, cr:0.30, out:15}},
  {id:'claude-sonnet-4-6', label:'Sonnet 4.6', in:3,   cw5:3.75,  cw1:6,    cr:0.30, out:15},
  {id:'claude-sonnet-4-5', label:'Sonnet 4.5', in:3,   cw5:3.75,  cw1:6,    cr:0.30, out:15},
  {id:'claude-sonnet-4',   label:'Sonnet 4',   in:3,   cw5:3.75,  cw1:6,    cr:0.30, out:15},
  {id:'claude-haiku-4-5',  label:'Haiku 4.5',  in:1,   cw5:1.25,  cw1:2,    cr:0.10, out:5},
  {id:'claude-haiku-3-5',  label:'Haiku 3.5',  in:0.80,cw5:1,     cw1:1.60, cr:0.08, out:4},
].sort((a,b)=>b.id.length-a.id.length);

/* Fast mode (research preview) replaces the base rates on Opus 5 / 4.8; the cache
   multipliers then apply on top of the fast base, not the standard one. */
const FAST_MODE={'claude-opus-5':{in:10,out:50},'claude-opus-4-8':{in:10,out:50}};
const CACHE_MULT={cw5:1.25, cw1:2, cr:0.1};

/* ── Long context ───────────────────────────────────────────────────────────
   Kept as a mechanism with nothing in it, deliberately. Every model in the book
   above that has a 1M-token window (Opus 5/4.8/4.7/4.6, Sonnet 5, Sonnet 4.6,
   Fable 5, Mythos 5) bills the full window at standard rates — the docs are
   explicit: "long-context requests are billed at standard pricing", and 1M is the
   default with no beta header needed. The remaining models have a 200k window, so
   they can't exceed the threshold in the first place.

   106 of the calls in this workspace's logs exceed 200k input tokens and are all
   correctly billed at standard rates. If a premium tier is ever reintroduced, add
   `longCtx:{over:200000, in:…, cw5:…, cw1:…, cr:…, out:…}` to that model's row and
   the arithmetic below picks it up — rather than someone having to notice. No rates
   are invented here: an absent tier means the published price has none. */
const LONG_CTX_THRESHOLD=200000;

/* ── Server-side tools ──────────────────────────────────────────────────────
   Billed on top of tokens, reported in usage.server_tool_use. Web fetch is free.
   Code execution bills by container-time (with 1,550 free hours/month), which the
   request count alone cannot price — so it is surfaced, never guessed at. */
const SERVER_TOOL_RATES={
  web_search_requests:{usd:0.01, label:'Web search', note:'$10 per 1,000 searches'},
  web_fetch_requests: {usd:0,    label:'Web fetch',  note:'no additional charge'},
};
const SERVER_TOOL_UNPRICED={
  code_execution_requests:{label:'Code execution',note:'billed by container-hour, not per request'},
};
/* Returns {usd, lines:[{label,count,usd,note}], unpriced:[…]} for one call. */
function serverToolFees(st){
  const out={usd:0,lines:[],unpriced:[]};
  if(!st||typeof st!=='object') return out;
  for(const [key,n] of Object.entries(st)){
    if(!n) continue;
    const r=SERVER_TOOL_RATES[key];
    if(r){ const usd=n*r.usd; out.usd+=usd; out.lines.push({label:r.label,count:n,usd,note:r.note}); continue; }
    const u=SERVER_TOOL_UNPRICED[key];
    out.unpriced.push({label:u?u.label:key,count:n,note:u?u.note:'no published per-request rate'});
  }
  return out;
}

/* `billing` merges what the request asked for and what the response says was applied:
   {speed, inferenceGeo, batch, serviceTier}. `inputTokens` selects the long-context
   tier where a model has one. */
function rateFor(model,billing,inputTokens){
  if(!model) return null;
  /* strip a beta/context suffix ("claude-opus-5[1m]") and any dated snapshot */
  const id=String(model).toLowerCase().replace(/\[.*$/,'');
  const hit=PRICE_BOOK.find(r=>id.startsWith(r.id));
  if(!hit) return null;
  let r={tier:hit.label,in:hit.in,cw5:hit.cw5,cw1:hit.cw1,cr:hit.cr,out:hit.out,note:null,
         longCtx:false, unknownTier:null};
  const add=n=>{ r.note=(r.note?r.note+' · ':'')+n; };
  if(hit.until&&Date.now()>=Date.parse(hit.until)) Object.assign(r,hit.after);

  const b=billing||{};
  /* long context: only applies where the published price defines a tier */
  if(hit.longCtx&&inputTokens>(hit.longCtx.over??LONG_CTX_THRESHOLD)){
    Object.assign(r,hit.longCtx); r.longCtx=true; add('long context >'+k(hit.longCtx.over??LONG_CTX_THRESHOLD));
  }
  const fast=b.speed==='fast'&&FAST_MODE[hit.id];
  if(fast){
    r.in=fast.in; r.out=fast.out;
    r.cw5=r.in*CACHE_MULT.cw5; r.cw1=r.in*CACHE_MULT.cw1; r.cr=r.in*CACHE_MULT.cr;
    add('fast mode');
  }
  if(b.batch){ for(const key of ['in','cw5','cw1','cr','out']) r[key]*=0.5; add('batch −50%'); }
  if(b.inferenceGeo==='us'){ for(const key of ['in','cw5','cw1','cr','out']) r[key]*=1.1; add('us residency ×1.1'); }
  /* Anything other than the standard service tier may carry rates we don't hold.
     Surface it instead of quietly applying standard prices to a priority request. */
  if(b.serviceTier&&b.serviceTier!=='standard'&&b.serviceTier!=='not_available'){
    r.unknownTier=b.serviceTier; add('service tier: '+b.serviceTier+' (rates unverified)');
  }
  return r;
}

/* Total input tokens on a call — the figure the long-context tier is keyed on. */
const inTok=c=>(c.in||0)+(c.cr||0)+(c.cw||0);
/* The rate card that actually applied to this specific call. */
const rateOf=c=>rateFor(c.model,c.billing,inTok(c));

/* Cost of one call: tokens at their category rates, plus any server-side tool fees.
   Returns null — not 0 — when the model is not in the book, so an unpriced call is
   visibly unpriced instead of quietly free. */
function costOf(c){
  const r=rateOf(c); if(!r) return null;
  return tokenCostOf(c) + serverToolFees(c.serverTools).usd;
}
function tokenCostOf(c){
  const r=rateOf(c); if(!r) return null;
  return ((c.in||0)*r.in + (c.cr||0)*r.cr + (c.cw5||0)*r.cw5 + (c.cw1||0)*r.cw1 + (c.out||0)*r.out)/1e6;
}
/* Just the input side — what the prefix costs, used to price the recurring tool tax. */
function inputCostOf(c){
  const r=rateOf(c); if(!r) return null;
  return ((c.in||0)*r.in + (c.cr||0)*r.cr + (c.cw5||0)*r.cw5 + (c.cw1||0)*r.cw1)/1e6;
}
/* Caching is two opposing numbers, so don't report one and call it the saving:
     avoided = those cache reads at full input price
     premium = what the writes cost ABOVE full input price to make that possible
   net = avoided − premium is what caching is actually worth on this call. */
function cacheEconomicsOf(c){
  const r=rateOf(c); if(!r) return {avoided:0,premium:0,net:0};
  const avoided=(c.cr||0)*(r.in-r.cr)/1e6;
  const premium=((c.cw5||0)*(r.cw5-r.in)+(c.cw1||0)*(r.cw1-r.in))/1e6;
  return {avoided,premium,net:avoided-premium};
}

/* Keep memory bounded — the proxy can run for days. */
const MAX_CALLS=400;

/* A real model turn. count_tokens probes are not billed and carry no usage. */
const isModelCall=e=>e.method==='POST'&&String(e.url).includes('/v1/messages')
  &&!String(e.url).includes('count_tokens');

const callIndex={};                    // proxy request id -> index into DATA.calls
function reindexCalls(){
  for(const k in callIndex) delete callIndex[k];
  DATA.calls.forEach((c,i)=>{ callIndex[c.uid||c.id]=i; });
}

/* The newest real agent turn — what the ribbon, the context budget and the trace
   all describe. Claude Code also issues calls that are billed but are not a turn
   of agent work: summarisers and classifiers that carry a system prompt and no
   tool set at all. Since this whole UI is about the tool tax, prefer the newest
   call that actually shipped a tool set, and only fall back if none has. */
function pickTurn(src){
  const rev=src.slice().reverse();
  return rev.find(c=>!c.fromHist&&c.toolCount>1)
      || rev.find(c=>!c.fromHist&&c.sysTok>0)
      || rev.find(c=>!c.fromHist)
      || src[src.length-1]
      || null;
}
function latestLiveCall(){
  return pickTurn(DATA.calls);
}
function latestCall(){
  return pickTurn(VW.length?VW:DATA.calls);
}
function latestIndex(){
  const c=latestCall();
  if(!c) return -1;
  const i=VW.findIndex(x=>(x.uid||x.id)===(c.uid||c.id));
  return i>=0?i:-1;
}

/* ---- proxy "request" event -> a DATA.calls row --------------------------- */
function ingestRequest(e){
  if(!isModelCall(e)){ LIVE.skipped++; return false; }
  const p=e.preview||{};
  const call={
    id:e.id, uid:e.uid||e.id, time:e.time, model:e.model||'—',
    msgCount:e.msgCount||0, toolCount:e.toolCount||0, toolTotal:e.toolTotal||0,
    sysTok:e.systemTokens||0, msgTok:e.msgTokens||0,
    /* Raw chars/4 estimates, kept untouched. The displayed sysTok/toolTotal/msgTok
       above are these scaled to the token count the API actually reported — see
       applyCal(). Never price off the raw figures: they run ~35% low. */
    est:{sys:e.systemTokens||0, tools:e.toolTotal||0, msg:e.msgTokens||0,
         total:(e.systemTokens||0)+(e.toolTotal||0)+(e.msgTokens||0)},
    cal:null, calUsed:1,
    billing:e.billing||null,
    status:null, ms:null, in:0, cr:0, cw:0, cw5:0, cw1:0, out:0, think:0,
    cost:null, inCost:null, saved:0, cachePremium:0, cacheNet:0, error:null,
    breaks:p.cacheBreakpoints||0,
    params:p.params||{max_tokens:null,temperature:null,stream:false,thinking:null},
    sys:((p.system&&p.system.blocks)||[]).map(b=>({c:b.chars||0,cache:!!b.cache,x:b.text||''})),
    tools:(p.tools||[]).map(t=>({name:t.name,tokens:t.tokens||0,raw:t.tokens||0,bytes:t.bytes||0})),
    msgs:(p.messages||[]).map(m=>({r:m.role||'?',
      b:(m.blocks||[]).map(b=>({t:b.type||'text',n:b.name||null,c:b.chars||0,x:b.text||'',e:!!b.isError}))})),
    trace:(p.trace||[]).map(t=>({i:t.i,tool:t.tool,desc:t.desc||'',arg:t.arg||'',m:t.m})),
  };
  if(call.trace.length) mergeActions(call.trace, call.time);
  const key=e.uid||e.id;
  const at=callIndex[key];
  if(at!=null){ DATA.calls[at]=call; return true; }     // replay/duplicate
  DATA.calls.push(call);
  LIVE.seen++;
  if(DATA.calls.length>MAX_CALLS){
    const drop=DATA.calls.length-MAX_CALLS;
    DATA.calls.splice(0,drop);
    if(typeof S==='object'&&S) S.sel=Math.max(0,S.sel-drop);   // keep the drawer anchored
  }
  reindexCalls();
  return true;
}

/* ---- proxy "response" event -> usage, latency and price for that row ----- */
function ingestResponse(e){
  const at=callIndex[e.uid||e.id]; if(at==null) return false;
  const c=DATA.calls[at];
  c.status=e.status??null;
  c.ms=e.ms??null;
  c.in=e.inputTokens||0; c.cr=e.cacheRead||0; c.cw=e.cacheCreate||0; c.out=e.outputTokens||0;
  c.think=e.thinkingTokens||0;
  c.serverTools=e.serverTools||null;
  c.iterCount=e.iterCount||null;
  /* The response is authoritative about which rate modifiers were applied; the
     request only says what was asked for. Merge, response winning. */
  c.billing={...(c.billing||{}),
    serviceTier:e.serviceTier??null,
    inferenceGeo:e.inferenceGeo==='us'?'us':(c.billing?.inferenceGeo??null)};
  /* TTL split drives the write price. Older proxies didn't report it — fall back to
     the 5m default so the total still reconciles with cacheCreate. */
  c.cw1=e.cacheWrite1h||0;
  c.cw5=e.cacheWrite5m!=null?e.cacheWrite5m:Math.max(0,c.cw-c.cw1);
  /* exact calibration for this call, now that the true input total is known */
  c.cal=c.est.total?(c.in+c.cr+c.cw)/c.est.total:null;
  applyCal(c);
  c.cost=costOf(c);
  c.inCost=inputCostOf(c);
  const ce=cacheEconomicsOf(c);
  c.saved=ce.avoided; c.cachePremium=ce.premium; c.cacheNet=ce.net;
  c.error=e.error||null;
  c.updatedAt=Date.now();       // lets an open inspector notice it went stale
  return true;
}

/* ── Token calibration ──────────────────────────────────────────────────────
   Iris sizes the system prompt, each tool schema and the history by counting
   characters and dividing by four. That is the only option available before a
   response arrives, and it is wrong: measured against reported usage over 488
   recorded calls the real count is 1.55x higher on Opus 5 (p10 1.53, p90 1.61) —
   Claude 4.7 and later use a tokenizer that produces materially more tokens per
   character. Left uncorrected, every token figure and every dollar derived from
   one reads about 35% low.

   No tokenizer is needed to fix it. The reported input total (uncached + cache
   read + cache write) covers exactly the same three things the estimate covers, so
   the ratio between them is the correction — measured per call, exactly. Calls
   still in flight borrow the session's factor until their own response lands. */
function applyCal(c){
  const f=(c.cal ?? T.cal ?? 1);
  c.calUsed=f;
  c.sysTok=Math.round(c.est.sys*f);
  c.toolTotal=Math.round(c.est.tools*f);
  c.msgTok=Math.round(c.est.msg*f);
  for(const t of c.tools) t.tokens=Math.round((t.raw||0)*f);
}

/* ---- deny list (authoritative: .claude/settings.json) -------------------- */
function applyDeny(list){
  LIVE.denySet=new Set(list||[]);
  DATA.deny.length=0; DATA.deny.push(...LIVE.denySet);
}

/* ---- captured schemas: the real description + input_schema off the wire --- */
function applyToolDocs(list){
  (list||[]).forEach(t=>{
    if(!t||!t.name) return;
    DATA.docs[t.name]=(t.desc||'(schema shipped with no description)')
      +(t.schema?'\n\ninput_schema:\n'+t.schema:'');
    LIVE.docTok[t.name]={tokens:t.tokens||0,bytes:t.bytes||0};
    if(t.desc) LIVE.wireDesc[t.name]=t.desc;
  });
}

/* ---- tool inventory ------------------------------------------------------
   Union of: every schema that shipped, everything named in the deny list, and
   everything we hold a captured schema for. Object identity is preserved so a
   rebuild never disturbs anything holding a row. Call counts are filled in by
   recalc() from the trace. */
function rebuildInventory(){
  const size={};
  Object.keys(LIVE.docTok).forEach(n=>{ size[n]=LIVE.docTok[n]; });
  DATA.calls.forEach(c=>c.tools.forEach(t=>{ size[t.name]={tokens:t.tokens,bytes:t.bytes}; }));
  LIVE.denySet.forEach(n=>{ if(!size[n]) size[n]={tokens:0,bytes:0}; });
  const byName={}; DATA.tools.forEach(t=>{ byName[t.name]=t; });
  const rows=Object.keys(size).sort().map(n=>{
    const t=byName[n]||{name:n,calls:0};
    t.tokens=size[n].tokens; t.bytes=size[n].bytes;
    t.on=!LIVE.denySet.has(n);
    if(t.calls==null) t.calls=0;
    return t;
  });
  DATA.tools.length=0; DATA.tools.push(...rows);
}

/* ---- session meta: model and pricing follow the newest real turn --------- */
function syncMeta(){
  const c=latestCall();
  if(c&&c.model&&c.model!=='—') DATA.meta.model=c.model;
  DATA.meta.billing=c?c.billing:null;
  const r=rateFor(DATA.meta.model,DATA.meta.billing);
  DATA.meta.pricing=r
    ? {in:r.in,out:r.out,cw5:r.cw5,cw1:r.cw1,cr:r.cr,tier:r.tier,note:r.note}
    : {in:0,out:0,cw5:0,cw1:0,cr:0,tier:null,note:null};
  if(DATA.calls.length){
    DATA.meta.start=DATA.calls[0].time;
    DATA.meta.end=DATA.calls[DATA.calls.length-1].time;
  }
}
</script>
<script>
/* ── Tool catalogue ────────────────────────────────────────────────────────
   tier decides what is safe to switch off:
     core     — the agent cannot do basic work without it
     standard — useful, safe to drop if you don't need that capability
     optional — convenience or integration; usually the first thing to trim
   Blurbs are written in plain language. Where Iris actually captured the
   schema text off the wire, the row can expand to show the real description. */
const GROUPS=[
  {id:'files',       t:'Files & shell',            s:'Reading, writing and running things on this machine. Take these away and the agent cannot do the job.'},
  {id:'delegation',  t:'Delegation & background work', s:'Handing sub-tasks to other agents and collecting their results.'},
  {id:'worktree',    t:'Isolated worktrees',       s:'Working in a throwaway git checkout so your branch stays clean.'},

const TOOLMETA={

  ScheduleWakeup:{g:'automation',tier:'optional',d:'Wakes the agent up at a time you set.'},
  CronCreate:  {g:'automation',tier:'optional',d:'Creates a recurring scheduled run.'},
  CronDelete:  {g:'automation',tier:'optional',d:'Deletes a scheduled run.'},
  CronList:    {g:'automation',tier:'optional',d:'Lists the scheduled runs that exist.'},
  ReportFindings:{g:'automation',tier:'optional',d:'Files a structured findings report at the end of a run.'},
  Monitor:     {g:'integrations',tier:'optional',d:'Streams this proxy\u2019s own traffic back to the agent so it can read its own telemetry.'},
  DesignSync:  {g:'integrations',tier:'optional',d:'Syncs design files from a connected design tool.'},
  ShareOnboardingGuide:{g:'integrations',tier:'optional',d:'Shares a setup guide with a teammate.'},
};
/* Unknown tool (an MCP server, a plugin, a new built-in): fall back to the first
   sentence of the description Iris actually read off the wire. */
function meta(n){
  if(TOOLMETA[n]) return TOOLMETA[n];
  const wire=LIVE.wireDesc[n];
  const d=wire
    ? wire.split(/(?<=\.)\s|\n/)[0].trim().slice(0,180)
    : 'No description captured. Iris has not seen this schema ship yet.';

}
const TIER={core:{t:'Core',c:'wire',h:'Required for basic work'},standard:{t:'Standard',c:'vio',h:'Safe to drop if unused'},optional:{t:'Optional',c:'',h:'Usually the first to trim'}};
/* ═══════════════ Iris for Claude Code ═══════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const k=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n));

   because a per-turn tool cost is often fractions of a cent and rounding it to
   $0.00 is the difference between a real number and a shrug. */
const usd=n=>{
  if(n==null||!isFinite(n)) return '—';
  const a=Math.abs(n);

};
const ms=n=>n==null?'—':n<1000?n+'ms':(n/1000).toFixed(n<10000?1:0)+'s';
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function irisToken(){
  try{
    const q=new URLSearchParams(location.search).get('iris_token');
    if(q){
      sessionStorage.setItem('iris.uiToken',q);
      const u=new URL(location.href);
      u.searchParams.delete('iris_token');
      history.replaceState({},'',u.pathname+u.search+u.hash);

    return sessionStorage.getItem('iris.uiToken')||localStorage.getItem('iris.uiToken')||'';

const S={ view:'overview', sel:-1, pending:{}, order:'tokens', filter:'all', tf:'all', unlockCore:false, follow:true, proj:null,
           tw:'today', tt:'all', tracePage:1, ctxTab:'breakdown' };

const pendCount=()=>Object.keys(S.pending).length;

/* ── session rollups ───────────────────────────────────────────────────

   event; T keeps its identity so the views can close over it. */
const T={};
function recalc(){

     real usage, then applied to every call, and only then does the tool inventory
     read those (now corrected) per-tool token counts. */
  let estSum=0, actSum=0;
  for(const c of C){
    if(c.status==null||!c.est.total) continue;
    estSum+=c.est.total; actSum+=c.in+c.cr+c.cw;
  }
  T.cal=estSum?actSum/estSum:null;
  T.calFrom=estSum?C.filter(c=>c.status!=null&&c.est.total).length:0;
  for(const c of C) applyCal(c);

  rebuildInventory();
  if(HIST.records.length&&!HIST.days.length) digestHistory();

  /* Optimize inventory is the live session, not the time window: a historical
     ledger row has no tool-call trace, and mixing it in would zero every count. */
  const liveTurn=latestLiveCall();
  TRACE.length=0; if(liveTurn) TRACE.push(...(liveTurn.trace||[]));
  const used={}; TRACE.forEach(t=>{ used[t.tool]=(used[t.tool]||0)+1; });
  Object.keys(used).forEach(n=>{
    if(!TOOLS.find(t=>t.name===n)) TOOLS.push({name:n,tokens:0,bytes:0,calls:0,on:!LIVE.denySet.has(n)});
  });

  VW.length=0;
  VW.push(...scopedCalls());

  Object.assign(HW, digestRecords(histWin));

  const done=VW.filter(x=>x.status!=null);
  const lat=done.map(x=>x.ms).filter(v=>v!=null).sort((a,b)=>a-b);
  const sum=f=>VW.reduce((a,x)=>a+(f(x)||0),0);
  Object.assign(T,{
    calls:VW.length,
    done:done.length,
    shipped:sum(x=>x.in+x.cr+x.cw),
    out:sum(x=>x.out),
    think:sum(x=>x.think),
    priced:VW.filter(x=>x.cost!=null).length,
    inputCost:sum(x=>x.inCost),
    saved:sum(x=>x.saved),
    cachePremium:sum(x=>x.cachePremium),
    cacheNet:sum(x=>x.cacheNet),
    cacheR:sum(x=>x.cr),
    cacheW:sum(x=>x.cw),
    cacheW5:sum(x=>x.cw5),
    cacheW1:sum(x=>x.cw1),
    /* calls whose model isn't in the price book — excluded from every $ figure */
    unpriced:VW.filter(x=>x.status!=null&&x.cost==null).length,
    /* server-side tool fees, billed on top of tokens */
    toolFees:VW.reduce((a,x)=>a+serverToolFees(x.serverTools).usd,0),
    /* calls big enough to hit a long-context tier, and how many actually got one */
    over200k:VW.filter(x=>inTok(x)>LONG_CTX_THRESHOLD).length,
    longCtx:VW.filter(x=>rateOf(x)?.longCtx).length,

  T.serverTools=stAll;

     Wall-clock span is the wrong denominator: a log spanning several days averages in
     nights, lunches and meetings, which understates the pace you actually work at by
     an order of magnitude. So sum the gaps between consecutive calls and drop any gap
     longer than IDLE_GAP — what remains is active time, and the turns that happened
     inside it. Under a minute of active time says nothing, so report nothing. */
  T.spanHours=(VW.length>1?Date.parse(VW[VW.length-1].time)-Date.parse(VW[0].time):0)/36e5;
  let active=0, turns=0;
  for(let i=1;i<VW.length;i++){
    const g=Date.parse(VW[i].time)-Date.parse(VW[i-1].time);
    if(g>0&&g<=IDLE_GAP_MS){ active+=g; turns++; }
  }
  T.activeHours=active/36e5;
  T.idleHours=Math.max(0,T.spanHours-T.activeHours);

  T.p95=lat.length?lat[Math.min(lat.length-1,Math.floor(lat.length*.95))]:null;
  T.hit=(T.cacheR+T.cacheW)?T.cacheR/(T.cacheR+T.cacheW)*100:0;

  /* Rate used to price recurring prefix tokens (tool schemas, system prompt).
     NOT list input price: the prefix sits inside the cache, so from the second turn
     on it bills at the cache-read rate — 10% of input. Pricing it at list would
     overstate the tool tax by roughly 10x. This is the rate the session actually
     paid per input token, measured, so it accounts for the real read/write mix. */
  T.rateIn = T.shipped ? T.inputCost/T.shipped : (rateFor(M.model)?.cr ?? 0)/1e6;
  if(S.sel<0||S.sel>=VW.length) S.sel=Math.max(0,latestIndex());
}
/* $ per token for prefix tokens that re-ship every turn. */
const RATE_IN=()=>T.rateIn||0;

/* ══ Action ledger ══════════════════════════════════════════════════════════
   Actions come from /__actions, which the proxy stamps and persists so they
   outlive one conversation — the whole point of an hour/day/week/month filter.
   Live requests are merged in with the same identity rule so the newest action
   appears without waiting for a refetch. */
const ACTS={list:[],total:0,keys:new Set(),loaded:false,newest:null};
const actKey=a=>`${a.i}|${a.tool}|${(a.arg||'').slice(0,120)}`;
/* One action arrives twice: live over SSE (call.trace) and again from
   /__actions when the ledger loads. The server stamps its rows with a hashed
   key, this page derives a sliced one, so trusting a.k meant the same action
   held two different keys and every row rendered twice. Always key locally —
   both sources carry i/tool/arg, so one rule covers both. */
function mergeActions(rows,stamp){
  let added=0;
  for(const a of rows||[]){
    if(!a||!a.tool) continue;
    const k=actKey(a);
    if(ACTS.keys.has(k)) continue;
    ACTS.keys.add(k);
    ACTS.list.push({k,t:a.t||stamp||new Date().toISOString(),i:a.i,tool:a.tool,desc:a.desc||'',arg:a.arg||''});
    added++;
  }
  if(added){
    ACTS.list.sort((x,y)=>(x.t<y.t?-1:x.t>y.t?1:x.i-y.i));
    ACTS.newest=ACTS.list[ACTS.list.length-1].t;
    ACTS.total=ACTS.list.length;
  }
  return added;
}
/* Calendar windows, not rolling ones: "This week" should mean this week.
   One control in the header — every view reads S.tw. */
const TIME_WINDOWS=[

  {id:'week',  label:'This week', from:()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return +d;}},
  {id:'month', label:'This month',from:()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(1);return +d;}},
  {id:'all',   label:'All',       from:()=>-Infinity},
];
const TRACE_WINDOWS=TIME_WINDOWS;
const timeWindow=()=>TIME_WINDOWS.find(w=>w.id===S.tw)||TIME_WINDOWS[1];
const traceWindow=timeWindow;

function inWindow(iso){

function actionsIn(win){

  return ACTS.list.filter(a=>Date.parse(a.t)>=from);

function scopedHist(){ return HIST.records.filter(r=>inWindow(r.time)); }
function histToCall(r){
  const ce=cacheEconomicsOf(r);
  return {
    id:r.id, uid:r.uid, time:r.time, model:r.model||'—',
    msgCount:r.msgCount||0, toolCount:r.toolCount||0,

    est:{sys:r.estSys||0, tools:r.estTools||0, msg:r.estMsg||0,
         total:(r.estSys||0)+(r.estTools||0)+(r.estMsg||0)},
    cal:null, calUsed:1, billing:r.billing||null,
    status:r.status??null, ms:r.ms??null,
    in:r.in||0, cr:r.cr||0, cw:r.cw||0, cw5:r.cw5||0, cw1:r.cw1||0,
    out:r.out||0, think:r.think||0,

function scopedCalls(){

/* ══ Measured history ═══════════════════════════════════════════════════════
   /__history is the proxy's own ledger of every billable call it has ever seen,
   priced with the same functions as the live stream. It exists so monthly spend can
   be reported rather than extrapolated — the projection is only for answering
   "what would trimming this save", never for "what did I spend". */
const HIST={records:[],builtAt:null,building:false,days:[],models:{},expiries:[],
            cost:0,tok:0,out:0,cacheNet:0,activeDays:0};
/* Spend ledger rolled up for the header time window (not the full index). */
const HW={records:[],days:[],models:{},expiries:[],cost:0,tok:0,out:0,cacheNet:0,activeDays:0};

/* Anthropic's published enterprise benchmark, for a sense of scale. */
const BENCH={perActiveDay:13, perMonthLow:150, perMonthHigh:250};

const dayKey=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};

/* A gap longer than the cache lifetime means the next call reprocessed the whole
   prefix at write price instead of reading it at a tenth of input. The lifetime is
   an hour on a subscription and five minutes on an API key — inferred here from the
   TTL the write actually used rather than assumed. */
function cacheExpiries(recs){
  const out=[];
  for(let i=1;i<recs.length;i++){
    const prev=recs[i-1], cur=recs[i];
    const gapMin=(Date.parse(cur.time)-Date.parse(prev.time))/60000;
    if(!(gapMin>0)||!cur.cw) continue;
    const ttl=cur.cw1>0?60:5;
    if(gapMin<=ttl) continue;
    const r=rateOf(cur);
    const paid=r?((cur.cw5||0)*r.cw5+(cur.cw1||0)*r.cw1)/1e6:null;
    const asRead=r?cur.cw*r.cr/1e6:null;
    out.push({time:cur.time,gapMin,ttl,tok:cur.cw,paid,excess:paid!=null?paid-asRead:0});
  }
  return out;
}

function digestRecords(recs){
  const sorted=recs.slice().sort((a,b)=>(a.time<b.time?-1:1));
  const byDay=new Map(), models={};
  let cost=0,tok=0,out=0,net=0;
  for(const r of sorted){
    r.cost=costOf(r);
    const ce=cacheEconomicsOf(r);
    r.cacheNet=ce.net;
    const k2=dayKey(r.time);
    if(!byDay.has(k2)) byDay.set(k2,{day:k2,calls:0,cost:0,in:0,cr:0,cw:0,out:0,think:0,net:0,ms:[],models:{}});
    const d=byDay.get(k2);
    d.calls++; d.cost+=r.cost||0; d.in+=r.in; d.cr+=r.cr; d.cw+=r.cw; d.out+=r.out; d.think+=r.think||0; d.net+=ce.net;
    if(r.ms!=null) d.ms.push(r.ms);
    d.models[r.model]=(d.models[r.model]||0)+1;
    models[r.model]=(models[r.model]||0)+(r.cost||0);
    cost+=r.cost||0; tok+=r.in+r.cr+r.cw; out+=r.out; net+=ce.net;
  }
  return {records:sorted, days:[...byDay.values()], models, cost, tok, out, cacheNet:net,
          activeDays:byDay.size, expiries:cacheExpiries(sorted)};
}
function digestHistory(){
  const d=digestRecords(HIST.records);
  HIST.days=d.days; HIST.models=d.models; HIST.cost=d.cost; HIST.tok=d.tok;
  HIST.out=d.out; HIST.cacheNet=d.cacheNet; HIST.activeDays=d.activeDays; HIST.expiries=d.expiries;
}

/* ── Monthly projection ─────────────────────────────────────────────────────
   A per-turn saving means nothing until you know how many turns a month holds.
   The turn rate is measured from this capture; the working pattern is an
   assumption, so it is a control the user can change rather than a number buried
   in the code. Both are stated wherever a monthly figure appears. */
const PROJ_DEFAULTS={hoursPerDay:6, daysPerMonth:22, fallbackTurnsPerHour:30};
/* A pause longer than this is you not working, not the agent being slow. */
const IDLE_GAP_MS=5*60*1000;
function projLoad(){
  try{ const j=JSON.parse(localStorage.getItem('iris.projection')||'{}');
    return {hoursPerDay:+j.hoursPerDay||PROJ_DEFAULTS.hoursPerDay,
            daysPerMonth:+j.daysPerMonth||PROJ_DEFAULTS.daysPerMonth}; }
  catch(e){ return {hoursPerDay:PROJ_DEFAULTS.hoursPerDay,daysPerMonth:PROJ_DEFAULTS.daysPerMonth}; }
}
function projSave(){
  try{ localStorage.setItem('iris.projection',JSON.stringify({hoursPerDay:S.proj.hoursPerDay,daysPerMonth:S.proj.daysPerMonth})); }catch(e){}
}
S.proj=projLoad();   // set here, not at S's declaration: the helpers live in this block

/* turns/hour: measured when the capture is long enough to mean anything */
const turnsPerHour=()=>T.turnsPerHour||PROJ_DEFAULTS.fallbackTurnsPerHour;
const measuredRate=()=>T.turnsPerHour!=null;
const turnsPerDay  =()=>turnsPerHour()*S.proj.hoursPerDay;
const turnsPerMonth=()=>turnsPerDay()*S.proj.daysPerMonth;
/* What a per-turn token count costs over a turn / day / month. */
function project(tokens){
  const perTurn=tokens*RATE_IN();
  return {perTurn, perDay:perTurn*turnsPerDay(), perMonth:perTurn*turnsPerMonth()};
}
/* Plain-language statement of what any monthly number rests on. */
const hrs=h=>h<1?(h*60).toFixed(0)+' min':h.toFixed(1)+' h';
const projBasis=()=>
  `${measuredRate()
    ? `measured ${turnsPerHour().toFixed(0)} turns/hour across ${hrs(T.activeHours)} of active work`
      +`${T.idleHours>0.05?` (${hrs(T.idleHours)} of idle time excluded from ${hrs(T.spanHours)} elapsed)`:''}`
    : `assumed ${PROJ_DEFAULTS.fallbackTurnsPerHour} turns/hour — not enough active time captured to measure`}`
  +` × ${S.proj.hoursPerDay} h/day × ${S.proj.daysPerMonth} days = ${fmt(turnsPerMonth())} turns/month,`
  +` priced at the measured ${mtok(RATE_IN()*1e6)} you actually paid for input`;
/* The write multiplier a given call actually paid, blended if it mixed TTLs. */
function wMult(c){
  const r=rateOf(c); if(!r||!c.cw) return '1.25';
  return (((c.cw5||0)*r.cw5+(c.cw1||0)*r.cw1)/c.cw/r.in).toFixed(2);
}
/* A per-Mtok list rate, printed the way the price book prints it. */
const mtok=n=>n==null?'—':'$'+(n%1===0?n:n.toFixed(2))+'/Mtok';
/* Cache reads as a percentage of base input — 10% by definition, but derived so it
   stays honest if a rate ever changes. */
const crPct=()=>M.pricing.in?(M.pricing.cr/M.pricing.in*100).toFixed(0):'10';
const TAX=()=>TOOLS.filter(isOn).reduce((a,t)=>a+t.tokens,0);        // staged: what you'd ship
const TAX_LIVE=()=>TOOLS.reduce((a,t)=>a+(t.on?t.tokens:0),0);        // published: what ships today
const pct=(a,b)=>b?a/b*100:0;                                         // never NaN in the markup

/* ── tiny svg helpers ──────────────────────────────────────────────── */
function spark(vals,w=104,h=34,color='#1B4DFF'){
  const mx=Math.max(0,...vals)||1, st=w/(vals.length-1||1);
  const pts=vals.map((v,i)=>`${(i*st).toFixed(1)},${(h-2-(v/mx)*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true">
    <polyline points="${pts}" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
    <polyline points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity=".07" stroke="none"/></svg>`;
}
const chevron=`<svg class="caret" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ═══════════════ SIGNATURE — the context ribbon ═══════════════
   The whole request payload, drawn to scale. Every pixel is a token
   that ships to the model on this turn. Cache breakpoints are notches. */
function ribbon(c){
  const sys=c.sys||[], msgs=c.msgs||[];
  /* --- the fixed prefix: system + tool schemas. Re-sent verbatim on every turn. --- */
  const pre=[], sysTot=sys.reduce((a,b)=>a+b.c,0)||1;
  sys.forEach((b,i)=>pre.push({cls:'sys',tok:c.sysTok*(b.c/sysTot),name:i===0?'System':'',
    kind:'System prompt · block '+(i+1), det:fmt(b.c)+' chars'+(b.cache?' · cache breakpoint':''), cache:b.cache}));
  TOOLS.filter(isOn).filter(t=>t.tokens>0).sort((a,b)=>b.tokens-a.tokens).forEach(t=>
    pre.push({cls:'too',tok:t.tokens,name:t.name,kind:'Tool schema · '+t.name,
      det:fmt(t.tokens)+' tok · '+(t.calls?t.calls+' calls this session':'never called')}));
  const preTok=pre.reduce((a,s)=>a+s.tok,0);

  /* --- the variable part: the conversation itself --- */
  const his=[], mTot=msgs.reduce((a,m)=>a+m.b.reduce((x,b)=>x+b.c,0),0)||1;
  msgs.forEach((m,i)=>{
    const ch=m.b.reduce((x,b)=>x+b.c,0); if(ch<=0) return;
    his.push({cls:'his'+(i%2?' alt':''),tok:c.msgTok*(ch/mTot),
      kind:`Message ${i+1}/${msgs.length} · ${m.r}`,
      det:[...new Set(m.b.map(b=>b.t))].join(' + ')+' · '+fmt(ch)+' chars'});
  });
  const tot=(preTok+c.msgTok)||1, prePct=preTok/tot*100;

  const cell=(s,pct,label)=>`<div class="seg ${s.cls}" style="flex:0 0 ${pct}%"
    data-kind="${esc(s.kind)}" data-det="${esc(s.det)}" data-tok="${Math.round(s.tok)}">${label||''}</div>`;

  /* magnified prefix — proportional within itself, so 9.5k tokens become readable */
  const mag=pre.map(s=>{
    const pct=s.tok/(preTok||1)*100;
    const label = (pct>5.4&&s.name) ? `<span class="cap">${esc(s.name)}<i>${fmt(s.tok)}</i></span>` : '';
    return cell(s,pct,label);
  }).join('');

  /* true scale */
  let acc=0; const notches=[];
  const strip=pre.concat(his).map(s=>{
    const pct=s.tok/tot*100; acc+=pct;
    if(s.cache) notches.push(acc);
    return cell(s,pct,'');
  }).join('');
  notches.push(prePct);

  return `<div class="rib-stage">
    <div class="rib-caption">Fixed prefix · ${fmt(preTok)} tokens re-sent every turn</div>
    <div class="rib-mag">${mag}</div>
    <svg class="rib-link" viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,0 100,0 ${prePct.toFixed(3)},22 0,22" fill="#1B4DFF" opacity=".08"/>
      <line x1="100" y1="0" x2="${prePct.toFixed(3)}" y2="22" stroke="#1B4DFF" stroke-width=".4" opacity=".45" vector-effect="non-scaling-stroke"/>
      <line x1="0" y1="0" x2="0" y2="22" stroke="#1B4DFF" stroke-width=".4" opacity=".45" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="ribbon" id="ribbon">${strip}
      <i class="prefix-lens" style="width:${prePct.toFixed(3)}%"></i>
      ${notches.map(p=>`<i class="notch" style="left:${p.toFixed(2)}%"></i>`).join('')}
      <span class="cap" style="position:absolute;left:calc(${prePct.toFixed(2)}% + 10px);top:9px">Conversation<i>${k(c.msgTok)} tokens · ${msgs.length} messages</i></span>
    </div>
    <div class="ribbon-scale"><span>0</span><span>${k(tot*.25)}</span><span>${k(tot*.5)}</span><span>${k(tot*.75)}</span><span>${k(tot)} tokens</span></div>
  </div>`;
}
function bindRibbon(c){
  const stage=$('.rib-stage'), tip=$('#ribTip'); if(!stage||!tip) return;
  const nOn=TOOLS.filter(t=>isOn(t)&&t.tokens>0).length;
  const base=`<b>${nOn} tool schemas and ${(c.sys||[]).length} system blocks</b> ship again on every single turn. The top band magnifies that fixed prefix; the bottom band is true scale. Hover anything.`;
  tip.innerHTML=base;
  stage.addEventListener('mousemove',e=>{
    const s=e.target.closest('.seg'); if(!s) return;
    tip.innerHTML=`<b>${esc(s.dataset.kind)}</b> — ${esc(s.dataset.det)}<span class="k">${fmt(+s.dataset.tok)} tok</span><span class="k">${usd(+s.dataset.tok*RATE_IN())}/turn</span><span class="k">${usd(project(+s.dataset.tok).perMonth)}/mo</span>`;
  });

}

function kpi(lbl,val,sp,foot,delta){
  return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div>
    <div class="foot">${delta}<span>${foot}</span></div>${sp}</div>`;
}
/* Signals, derived from the capture. A flag only appears when the condition it
   describes is actually true, so an empty-ish session reads as quiet, not broken. */
function riskFlags(){
  const f=[];

  const dead=TOOLS.filter(t=>isOn(t)&&t.tokens>0&&t.calls===0).sort((a,b)=>b.tokens-a.tokens);
  const deadTok=dead.reduce((a,t)=>a+t.tokens,0);
  if(dead.length) f.push({sev:'bad',icon:'◎',title:`${dead.length} tool schema${dead.length>1?'s':''} ship but ${dead.length>1?'were':'was'} never called`,
    body:`${dead.slice(0,3).map(t=>t.name).join(', ')}${dead.length>3?` +${dead.length-3} more`:''} — ${fmt(deadTok)} tokens re-sent every turn. `
      +`<b>${usd(project(deadTok).perMonth)}/month</b> of pure overhead at your current pace (${usd(project(deadTok).perTurn)} a turn).`,
    act:'tools',actLabel:'Trim'});

  const st=Object.entries(T.serverTools||{}).filter(([,n])=>n>0);
  if(st.length) f.push({sev:'ok',icon:'⊕',title:`Server-side tools billed on top of tokens`,
    body:st.map(([key,n])=>{
      const r=SERVER_TOOL_RATES[key];
      return `${r?r.label:key} ×${n}${r?` = ${usd(n*r.usd)} (${r.note})`:' — billed by time, not per request'}`;
    }).join(' · ')+`. Session total ${usd(T.toolFees)}.`});

  const failed=VW.filter(x=>x.status!=null&&(x.status<200||x.status>=300));
  if(failed.length) f.push({sev:'bad',icon:'✕',title:`${failed.length} call${failed.length>1?'s':''} failed upstream`,
    body:`${failed.slice(-3).map(x=>'call '+x.id+' → HTTP '+x.status+(x.error?' ('+esc(x.error)+')':'')).join(', ')}. A retried turn re-ships the whole payload, so failures are billed twice.`,
    act:'traffic',actLabel:'Inspect'});

  const done=VW.filter(x=>x.ms!=null);
  if(done.length){
    const slow=done.reduce((a,x)=>x.ms>a.ms?x:a,done[0]);
    f.push({sev:slow.cw>slow.cr?'warn':'ok',icon:'△',title:`Call ${slow.id} took ${ms(slow.ms)}`,
      body:slow.cw>slow.cr
        ? `Cold cache — ${fmt(slow.cw)} tokens written at ${wMult(slow)}× input price${slow.cw1?' (1-hour TTL)':''}. Every later turn reads that cache at ${crPct()}% of input instead of paying full freight.`
        : `Slowest turn of the session, but it read ${fmt(slow.cr)} tokens from cache rather than writing them. The time went to generation, not to prompt ingest.`,
      act:'traffic',actLabel:'Inspect'});
  }

  /* a tool the agent reached for that policy has since blocked */
  const blockedButUsed=TOOLS.filter(t=>t.calls>0&&!isOn(t));
  if(blockedButUsed.length){
    const t=blockedButUsed.sort((a,b)=>b.calls-a.calls)[0];
    f.push({sev:'ok',icon:'✓',title:`${t.name} is blocked but was used`,
      body:`The agent reached for it ${t.calls}× this session (first at action ${TRACE.find(x=>x.tool===t.name)?.i}). Your policy now denies the schema, so it stops shipping on the next session.`,
      act:'trace',actLabel:'View'});
  }

  if(T.unpriced) f.push({sev:'warn',icon:'?',title:`${T.unpriced} call${T.unpriced>1?'s':''} could not be priced`,
    body:`No list price on file for that model id, so those calls are excluded from every dollar figure here rather than counted as free. Add it to the price book in iris.html.`,
    act:'traffic',actLabel:'Inspect'});

  if(T.cacheR+T.cacheW>0) f.push({sev:T.hit>60?'ok':'warn',icon:'⛁',title:`Cache is carrying ${T.hit.toFixed(0)}% of input`,
    body:`${k(T.cacheR)} read from cache at ${mtok(M.pricing.cr)} versus ${k(T.cacheW)} written`
      +`${T.cacheW1?` (${k(T.cacheW1)} on the 1-hour TTL at ${mtok(M.pricing.cw1)}, 2× input)`:''}. `
      +`Net of the write premium that is ${usd(T.cacheNet)}.`});

  if(pendCount()) f.push({sev:'warn',icon:'●',title:`${pendCount()} policy change${pendCount()>1?'s':''} staged, not written`,
    body:`Nothing has been written to settings.json yet. Publish to apply — the agent picks it up on its next session.`,
    act:'tools',actLabel:'Review'});

  if(!f.length) f.push({sev:'ok',icon:'✓',title:'Nothing to flag',
    body:'Every enabled tool has been used, no call failed, and the cache is doing its job.'});
  return f;
}

/* ═══════════════ VIEW · SPEND (measured, not projected) ═══════════════ */
function vSpend(){

      <p class="sub">${HIST.building
        ? 'The proxy is indexing its logs — this happens once, then it is cached.'

  if(!HW.records.length) return `
    <div class="phead"><div><div class="eyebrow">Measured history · ${esc(win.label)}</div><h1>Spend</h1>

  const perActive=HW.activeDays?HW.cost/HW.activeDays:0;
  const days=HW.days;

  const ex=HW.expiries, exCost=ex.reduce((a,e)=>a+(e.paid||0),0), exExcess=ex.reduce((a,e)=>a+(e.excess||0),0);

  const p50=(arr)=>{const s=arr.filter(v=>v!=null).sort((a,b)=>a-b);return s.length?s[Math.floor(s.length/2)]:null;};
  const sparkDays=days.slice(-30);

  return `

    <div class="eyebrow">${esc(win.label)} · ${fmt(HW.records.length)} billable calls · ${HW.activeDays} active day${HW.activeDays===1?'':'s'}</div>

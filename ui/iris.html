    <p class="sub">Every call, priced from the usage the API reported.</p>
  </div></div>

  <div class="kpis">
    ${kpi(win.label,usd(HW.cost),spark(sparkDays.map(d=>d.cost),104,34,'#BB332A'),`${fmt(HW.records.length)} calls over ${HW.activeDays} active day${HW.activeDays===1?'':'s'}`,'')}
    ${kpi('Per active day',usd(perActive),'',`benchmark: Anthropic cites ~$${BENCH.perActiveDay}/dev/active day`,
      perActive?`<span class="delta ${perActive<BENCH.perActiveDay?'dn':'up'}">${(perActive/BENCH.perActiveDay*100).toFixed(0)}% of benchmark</span>`:'')}
    ${kpi('Net cache saving',usd(HW.cacheNet),'',`across ${k(HW.tok)} input tokens`,'')}
    ${kpi('Cache hit',(HW.records.reduce((a,r)=>a+(r.cr||0),0)+HW.records.reduce((a,r)=>a+(r.cw||0),0))
      ? (HW.records.reduce((a,r)=>a+(r.cr||0),0)/(HW.records.reduce((a,r)=>a+(r.cr||0)+(r.cw||0),0))*100).toFixed(0)+'%'
      : '—','',`${k(HW.records.reduce((a,r)=>a+(r.cr||0),0))} read · ${k(HW.records.reduce((a,r)=>a+(r.cw||0),0))} written`,'')}
    ${kpi('Output',k(HW.out),'',`${k(days.reduce((a,d)=>a+d.think,0))} thinking tokens`,'')}
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="chead"><div><div class="ctitle">Cost per day</div>
      <div class="cnote" style="margin-top:3px">${days.length} active day${days.length===1?'':'s'} in this window. Bars are actual billed cost.</div></div>
      <span class="cnote" style="margin-left:auto">total ${usd(HW.cost)}</span></div>
    <div class="cbody">
      <div class="bars" style="height:120px">${days.map(d=>`<button class="bar" style="height:${Math.max(3,d.cost/mx*100)}%"
        title="${d.day} · ${usd(d.cost)} · ${d.calls} calls"></button>`).join('')}</div>
      <div class="xaxis">${days.map(d=>`<span>${d.day.slice(5)}</span>`).join('')}</div>
    </div>
    <div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>Day</th><th class="r">Calls</th><th class="r">Input</th><th class="r">Output</th>
        <th class="r">Cache hit</th><th class="r">p50 latency</th><th class="r">Cost</th></tr></thead>
      <tbody>${HW.days.slice().reverse().map(d=>{
        const hit=pct(d.cr,d.cr+d.cw);
        return `<tr><td class="mono">${d.day}</td><td class="r mono">${d.calls}</td>
          <td class="r mono">${k(d.in+d.cr+d.cw)}</td><td class="r mono">${k(d.out)}</td>
          <td class="r"><span class="tag ${hit>80?'ok':hit>1?'warn':'bad'} mono">${hit<1?'miss':hit.toFixed(0)+'%'}</span></td>
          <td class="r mono muted">${ms(p50(d.ms))}</td>
          <td class="r mono" style="font-weight:600">${usd(d.cost)}</td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr style="background:var(--well);font-weight:600">
        <td>${HW.activeDays} days</td><td class="r mono">${fmt(HW.records.length)}</td>
        <td class="r mono">${k(HW.tok)}</td><td class="r mono">${k(HW.out)}</td><td></td><td></td>
        <td class="r mono">${usd(HW.cost)}</td></tr></tfoot>
    </table></div>
  </div>

  <div class="split" style="margin-bottom:14px">
    <div class="card"><div class="chead"><div class="ctitle">Cache expiries</div>
      <span class="tag ${exExcess>HW.cost*0.1?'bad':'warn'}" style="margin-left:auto">${ex.length} rebuilds</span></div>
      <div class="cbody">
        <div class="small muted" style="margin-bottom:10px">Step away for longer than the cache lifetime and the next
          call reprocesses your whole context at write price instead of reading it at ${crPct()}% of input. The lifetime
          is an hour on a subscription, five minutes on an API key — read here from the TTL each write actually used.</div>
        <div class="kv"><span>Prefix rebuilds after an idle gap</span><b>${ex.length}</b></div>
        <div class="kv"><span>Tokens rewritten</span><b>${k(ex.reduce((a,e)=>a+e.tok,0))}</b></div>
        <div class="kv"><span>Paid for those writes</span><b style="color:var(--amber)">${usd(exCost)}</b></div>
        <div class="kv"><span>Excess over reading the same tokens</span><b style="color:var(--rust)">${usd(exExcess)}</b></div>
        <div class="kv"><span>Share of total spend</span><b>${pct(exExcess,HW.cost).toFixed(1)}%</b></div>
        ${ex.length?`<div class="hr" style="margin:11px 0"></div>
          <div style="font-size:12.5px;font-weight:700;margin-bottom:6px">Worst offenders</div>
          ${ex.slice().sort((a,b)=>b.excess-a.excess).slice(0,5).map(e=>`
            <div style="display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)">
              <span class="mono small muted" style="width:104px">${e.time.slice(5,16).replace('T',' ')}</span>
              <span class="small">idle ${e.gapMin<120?e.gapMin.toFixed(0)+' min':(e.gapMin/60).toFixed(1)+' h'}
                <span class="muted">· ${ttlLabel(e.ttl)} TTL · ${k(e.tok)} tok</span></span>
              <span class="mono small" style="margin-left:auto;color:var(--rust)">+${usd(e.excess)}</span>
            </div>`).join('')}`:''}
      </div></div>

    <div class="card"><div class="chead"><div class="ctitle">Where the money went</div></div><div class="cbody">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:8px">By model</div>
      ${models.map(([m,c])=>{
        const r=rateFor(m);
        return `<div style="margin-bottom:11px">
          <div style="display:flex;align-items:baseline;gap:8px">
            <b style="font-size:13px">${esc(r?r.tier:m)}</b>
            <span class="mono small muted">${esc(m)}</span>
            <span class="mono small" style="margin-left:auto">${usd(c)} · ${pct(c,HW.cost).toFixed(0)}%</span></div>
          <div class="stack" style="margin-top:5px"><i style="background:var(--sys);width:${pct(c,HW.cost)}%"></i></div>
        </div>`;
      }).join('')}
      <div class="hr"></div>
      <div class="kv" style="margin-top:8px"><span>Monthly run rate at this pace</span>
        <b>${usd(perActive*S.proj.daysPerMonth)}</b></div>
      <div class="kv sub2" style="display:block;color:var(--ink3);font-size:12.5px">
        ${usd(perActive)} per active day × ${S.proj.daysPerMonth} days. Anthropic cites
        $${BENCH.perMonthLow}–${BENCH.perMonthHigh} per developer per month across enterprise deployments.</div>
      <div class="kv"><span>Thinking tokens billed as output</span><b>${k(days.reduce((a,d)=>a+d.think,0))}</b></div>
      <div class="kv"><span>Records carrying latency</span>
        <b class="mono">${fmt(HW.records.filter(r=>r.ms!=null).length)} of ${fmt(HW.records.length)}</b></div>
      <div class="kv sub2" style="display:block;color:var(--ink3);font-size:12.5px">
        Latency was not written to the older payload logs; calls recorded from now on carry it.</div>
    </div></div>
  </div>

  <p class="small muted" style="max-width:78ch">Indexed from <b class="mono">.claude/proxy-logs/</b>${HIST.builtAt
    ? ` · last built ${new Date(HIST.builtAt).toLocaleString()}`:''}. Prices are Anthropic list rates, so promotional
    pricing, contracted discounts and subscription allowances are not reflected — for authoritative billing see the
    Claude Console. Calls whose model is not in the price book are excluded rather than counted as free.</p>`;
}

const ttlLabel=t=>t>=60?'1 hour':'5 min';

/* ═══════════════ VIEW · TRAFFIC ═══════════════ */
function vTraffic(){
  const mx=Math.max(0,...VW.map(x=>x.ms||0))||1;
  const inflight=VW.filter(x=>x.status==null).length;
  const win=timeWindow();
  return `
  <div class="phead"><div>
    <div class="eyebrow">${esc(win.label)}${inflight?` · ${inflight} in flight`:''}</div><h1>Traffic</h1>
    <p class="sub">Every request to the model, in order.</p>
  </div><div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <div class="segd" id="tfilter"><button aria-selected="${S.tf==='all'}" data-f="all">All ${VW.length}</button>
      <button aria-selected="${S.tf==='slow'}" data-f="slow">Slow</button>
      <button aria-selected="${S.tf==='cold'}" data-f="cold">Cache miss</button>
      <button aria-selected="${S.tf==='err'}" data-f="err">Failed</button></div>
  </div></div>
  ${VW.length?`<div class="card"><div class="tbl-scroll"><table class="tbl">
    <thead><tr><th>Call</th><th>Time</th><th class="r">Msgs</th><th class="r">Shipped</th>
      <th class="r">Out</th><th style="width:190px">Latency</th><th class="r">Cache</th><th class="r">Cost</th><th></th></tr></thead>
    <tbody id="trows">${VW.map((x,i)=>{
      const live=x.status==null, bad=!live&&(x.status<200||x.status>=300);
      const w=Math.max(4,(x.ms||0)/mx*100), cls=x.ms>20000?'vslow':x.ms>8000?'slow':'';
      const hit=pct(x.cr,x.cr+x.cw);
      const cache=live?'<span class="tag mono">···</span>'
        :`<span class="tag ${hit>80?'ok':hit>1?'warn':'bad'} mono">${hit<1?'miss':hit.toFixed(0)+'%'}</span>`;
      return `<tr data-call="${i}" data-slow="${x.ms>8000?1:0}" data-cold="${!live&&x.cw>x.cr?1:0}" data-err="${bad?1:0}">
        <td><b class="mono">${x.id}</b>${x.fromHist?' <span class="tag mono">ledger</span>':''}${bad?` <span class="tag bad mono">${x.status}</span>`:''}</td>
        <td class="mono small muted">${hhmm(x.time)}</td>
        <td class="r mono">${x.msgCount}</td>
        <td class="r mono">${live?'<span class="muted">···</span>':k(x.in+x.cr+x.cw)}</td>
        <td class="r mono">${live?'<span class="muted">···</span>':fmt(x.out)}</td>
        <td><div class="wf"><i class="${cls}" style="width:${live?0:w}%"></i><b>${live?'in flight':ms(x.ms)}</b></div></td>
        <td class="r">${cache}</td>
        <td class="r mono" style="font-weight:600">${live?'<span class="muted">···</span>':usd(x.cost)}</td>
        <td class="r"><span style="color:var(--ink3)">${chevron.replace('class="caret"','')}</span></td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr style="background:var(--well);font-weight:600">
      <td colspan="3">${VW.length} calls</td><td class="r mono">${k(T.shipped)}</td><td class="r mono">${fmt(T.out)}</td>
      <td class="mono small muted">p50 ${ms(T.p50)} · p95 ${ms(T.p95)}</td>
      <td class="r"><span class="tag ${T.hit>60?'ok':'warn'} mono">${T.hit.toFixed(0)}%</span></td>
      <td class="r mono">${usd(T.cost)}</td><td></td></tr></tfoot>
  </table></div></div>`:`<div class="card"><div class="cbody"><div class="empty">No calls in ${esc(win.label.toLowerCase())}.
    ${HIST.records.length||C.length?`Iris has ${fmt(HIST.records.length||C.length)} recorded — try a wider range.`:'Nothing recorded yet.'}</div></div></div>`}`;
}

/* ═══════════════ VIEW · CONTEXT ═══════════════ */
function vContext(){
  const c=latestCall();
  if(!c) return vEmptyWindow();
  const off=TOOLS.filter(t=>!isOn(t)), offTok=off.reduce((a,t)=>a+t.tokens,0);
  const measured=off.filter(t=>t.tokens>0).length;
  const dead=TOOLS.filter(t=>isOn(t)&&t.tokens>0&&t.calls===0);
  const deadTok=dead.reduce((a,t)=>a+t.tokens,0);
  const sys=c.sys||[], msgs=c.msgs||[];
  const toolTok=c.fromHist?(c.toolTotal||0):TAX();
  const tot=(c.sysTok+toolTok+c.msgTok)||1;
  const perTurn=t=>usd(t*RATE_IN()), perSession=t=>usd(t*RATE_IN()*T.calls);
  const enabled=TOOLS.filter(t=>isOn(t)&&t.tokens).length;
  const prefix=c.sysTok+toolTok;

  /* The conversation is ~99% of a mature window and had no breakdown anywhere
     in the UI. Roll the message blocks up by kind so the real consumer of the
     window is visible instead of being one undifferentiated purple band. */
  const KIND={tool_result:'Tool results',tool_use:'Tool calls',thinking:'Thinking',text:'Text'};
  const kinds={}; let convChars=0;
  for(const m of msgs) for(const b of (m.b||[])){
    const key=KIND[b.t]||'Other';
    kinds[key]=kinds[key]||{n:0,c:0};
    kinds[key].n++; kinds[key].c+=b.c||0; convChars+=b.c||0;
  }
  const roles={}; for(const m of msgs) roles[m.r]=(roles[m.r]||0)+1;

  const tab=S.ctxTab||'breakdown';
  const TABS=[
    ['breakdown','Breakdown',`${fmt(tot)} tok total`],
    ['system','System prompt',`${fmt(c.sysTok)} tok · ${sys.length} block${sys.length===1?'':'s'}`],
    ['tools','Tool schemas',`${fmt(toolTok)} tok · ${enabled}/${TOOLS.length} on`],
    ['conversation','Conversation',`${fmt(c.msgTok)} tok · ${fmt(msgs.length)} msgs`],
    ['changes','Changes','diff · attribution'],
  ];

  const paneBreakdown=()=>`
  <div class="split">
    <div class="card"><div class="chead"><div class="ctitle">Where the window goes</div></div><div class="cbody">
      ${[['System prompt',c.sysTok,'--sys',c.fromHist?`${fmt(c.sysTok)} tok estimated`:`${sys.length} blocks · ${sys.filter(b=>b.cache).length} cached`,'system'],
         ['Tool schemas',toolTok,'--too',c.fromHist?`${fmt(toolTok)} tok estimated`:`${enabled} of ${TOOLS.length} tools enabled`,'tools'],
         ['Conversation',c.msgTok,'--his',c.fromHist?`${fmt(c.msgTok)} tok estimated`:`${fmt(msgs.length)} messages`,'conversation']].map(([n,v,col,sub,go])=>`
        <div style="margin-bottom:14px">
          <div style="display:flex;align-items:baseline;gap:8px">
            <i class="sw" style="background:var(${col})"></i><b style="font-size:13px">${n}</b>
            <span class="mono small muted" style="margin-left:auto">${fmt(v)} tok · ${(v/tot*100).toFixed(1)}%</span></div>
          <div class="stack" style="margin-top:6px"><i style="background:var(${col});width:${v/tot*100}%"></i></div>
          <div class="small muted" style="margin-top:4px">${sub} · ${perTurn(v)} per turn
            <button class="linkish" data-ct="${go}">open</button></div>
        </div>`).join('')}
    </div></div>

    <div class="card"><div class="chead"><div class="ctitle">What the fixed prefix costs</div>
      <span class="cnote" style="margin-left:auto">system + tools, re-sent every turn</span></div><div class="cbody">
      <div class="kv"><span>Repeated on every turn</span><b>${fmt(prefix)} tok</b></div>
      <div class="kv"><span>Cost of that repetition, per turn</span><b>${usd(project(prefix).perTurn)}</b></div>
      <div class="kv"><span>Across ${T.calls} calls in this range</span><b>${perSession(prefix)}</b></div>
      <div class="kv"><span>Projected per month</span><b style="color:var(--amber)">${usd(project(prefix).perMonth)}</b></div>
      <div class="small muted" style="margin-top:6px">${projBasis()}.</div>
      ${deadTok?`<div class="sim" style="margin-top:12px"><div style="flex:1">
        <div style="font-weight:600">${dead.length} enabled schema${dead.length===1?'':'s'} never called</div>
        <div class="small muted" style="margin-top:3px">${fmt(deadTok)} tokens of that prefix is dead weight —
          <b style="color:var(--jade)">${usd(project(deadTok).perMonth)}/month</b>.</div>
      </div><button class="btn" data-ct="tools">Review</button></div>`:''}
    </div></div>
  </div>`;

  const paneSystem=()=>`
  <div class="card"><div class="chead"><div class="ctitle">System prompt · ${sys.length} blocks</div>
    <span class="cnote" style="margin-left:auto">cached blocks are billed once, then read at ${crPct()}% of input price</span></div>
    <div class="cbody" style="display:flex;flex-direction:column;gap:8px">
    ${sys.length?(bigSys=>sys.map((b,i)=>`<div class="acc${i===bigSys?' open':''}"><button class="ahead">${chevron}
      Block ${i+1}<span class="tag ${b.cache?'ok':''} mono">${fmt(b.c)} chars</span>
      ${b.cache?'<span class="tag ok">cached</span>':'<span class="tag warn">uncached</span>'}</button>
      <div class="abody"><div class="pre">${esc(b.x)}</div></div></div>`).join(''))(
      sys.reduce((best,b,i,a)=>b.c>a[best].c?i:best,0))
      :'<div class="empty">No system prompt captured for this row.</div>'}
    </div></div>`;

  const paneTools=()=>`
  <div class="card"><div class="chead"><div class="ctitle">Trim simulator</div>
    <span class="cnote" style="margin-left:auto">live</span></div><div class="cbody">
    <div class="sim"><div style="flex:1">
      <div style="font-weight:600">Currently blocked: ${off.length} tools</div>
      <div class="small muted" style="margin-top:3px">${measured
        ? `${measured} of them shipped while Iris was recording, so their size is known: <b>${fmt(offTok)} tokens</b> kept out of every request — <b style="color:var(--jade)">${usd(project(offTok).perMonth)}/month</b> you are already not paying.`
        : `None of them shipped while Iris was recording, so there is no measured saving to report yet.`}
        ${measured&&off.length-measured>0?`The other ${off.length-measured} were already blocked before recording started.`:''}</div>
    </div><div class="num" style="font-size:22px;font-weight:600;color:var(--jade)">−${k(offTok)}</div></div>

    <div style="margin-top:14px;font-size:12.5px;font-weight:700">Still shipping, never used</div>
    <div class="small muted" style="margin:3px 0 10px">These schemas were sent on all ${T.calls} turns and the agent never reached for one.</div>
    ${dead.length?dead.sort((a,b)=>b.tokens-a.tokens).map(t=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
        <button class="tog ${S.pending[t.name]!==undefined?'pend':''}" role="switch" aria-checked="${isOn(t)}" data-tool="${esc(t.name)}"></button>
        <b style="font-size:13px;flex:1">${esc(t.name)}</b>
        <span class="mono small muted">${fmt(t.tokens)} tok</span>
        <span class="mono small" style="color:var(--jade);width:74px;text-align:right" title="projected monthly saving">${usd(project(t.tokens).perMonth)}/mo</span>
      </div>`).join(''):'<div class="empty">Nothing idle. Every enabled tool got used.</div>'}
    <div class="kv" style="margin-top:12px"><span>If all trimmed · per turn <span class="tag warn">projected</span></span><b style="color:var(--jade)">${usd(project(deadTok).perTurn)}</b></div>
    <div class="kv"><span>If all trimmed · per month <span class="tag warn">projected</span></span><b style="color:var(--jade);font-size:17px">${usd(project(deadTok).perMonth)}</b></div>
  </div></div>`;

  const paneConversation=()=>{
    if(!msgs.length) return `<div class="card"><div class="cbody"><div class="empty">No payload text stored for this row.</div></div></div>`;
    const rows=Object.entries(kinds).sort((a,b)=>b[1].c-a[1].c);
    return `
    <div class="split">
      <div class="card"><div class="chead"><div class="ctitle">What the conversation is made of</div>
        <span class="cnote" style="margin-left:auto">${fmt(c.msgTok)} tok across ${fmt(msgs.length)} messages</span></div><div class="cbody">
        ${rows.map(([name,v])=>{
          const share=convChars?v.c/convChars:0;
          return `<div style="margin-bottom:14px">
            <div style="display:flex;align-items:baseline;gap:8px">
              <b style="font-size:13px">${name}</b>
              <span class="mono small muted" style="margin-left:auto">${fmt(Math.round(share*c.msgTok))} tok · ${(share*100).toFixed(1)}%</span></div>
            <div class="stack" style="margin-top:6px"><i style="background:var(--his);width:${share*100}%"></i></div>
            <div class="small muted" style="margin-top:4px">${fmt(v.n)} block${v.n===1?'':'s'} · ${fmt(v.c)} chars</div>
          </div>`;}).join('')}
        <div class="small muted">Shares are measured from block characters and applied to the calibrated
          conversation total, so they are proportional rather than separately billed figures.</div>
      </div></div>

      <div class="card"><div class="chead"><div class="ctitle">Messages by role</div></div><div class="cbody">
        ${Object.entries(roles).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`
          <div class="kv"><span>${esc(r)}</span><b>${fmt(n)}</b></div>`).join('')}
        <div class="kv"><span>Total messages</span><b>${fmt(msgs.length)}</b></div>
        <div class="small muted" style="margin-top:8px">History is the one part of the window that only grows.
          Tool results are usually the largest share and the easiest to shrink.</div>
      </div></div>
    </div>`;
  };

  const paneChanges=()=>`
  <div class="split">
    <div class="card"><div class="chead"><div class="ctitle">Context Diff</div>
      <button class="btn" id="btnCtxDiff" style="margin-left:auto">Refresh</button></div>
      <div class="cbody" id="ctxDiffBody"><div class="small muted">Comparing the two newest captured requests…</div></div></div>
    <div class="card"><div class="chead"><div class="ctitle">Tool result attribution</div>
      <button class="btn" id="btnToolRes" style="margin-left:auto">Refresh</button></div>
      <div class="cbody" id="toolResBody"><div class="small muted">Ranks which tool outputs dominate the window.</div></div></div>
  </div>`;

  const PANES={breakdown:paneBreakdown,system:paneSystem,tools:paneTools,conversation:paneConversation,changes:paneChanges};

  return `
  <div class="phead"><div><div class="eyebrow">Call ${c.id} · ${c.fromHist?'ledger row':`the newest turn in ${esc(timeWindow().label.toLowerCase())}`}</div><h1>Context budget</h1>
    <p class="sub">${c.fromHist?'Token counts from the spend ledger — payload text is not stored for historical rows.':'What the newest turn actually carried.'}</p></div></div>

  <div class="ribbon-card" style="margin-bottom:16px">
    <div class="ribbon-top"><div><div class="ctitle">Payload composition</div>
      <div class="cnote">${fmt(tot)} tokens${c.fromHist?'':` · ${c.breaks} cache breakpoints`}</div></div>
      <div class="ribbon-legend">
        <span class="lg"><i class="sw" style="background:var(--sys)"></i>System</span>
        <span class="lg"><i class="sw" style="background:var(--too)"></i>Tools</span>
        <span class="lg"><i class="sw" style="background:var(--his)"></i>History</span></div></div>
    ${c.fromHist?`<div class="empty">Payload text isn't stored on ledger rows. The bars below use measured token counts for this call.</div>`:ribbon(c)}
    <div class="ribbon-foot"><div id="ribTip"></div></div>
  </div>

  <div class="ctabs" id="ctxTabs" role="tablist">
    ${TABS.map(([id,label,sub])=>`
      <button class="ctab" role="tab" aria-selected="${tab===id}" data-ct="${id}">
        <b>${label}</b><span>${sub}</span></button>`).join('')}
  </div>

  ${(PANES[tab]||paneBreakdown)()}`;
}

/* ═══════════════ VIEW · TOOLS & POLICY ═══════════════ */
function vTools(){
  const onT=TOOLS.filter(isOn), delta=TAX()-TAX_LIVE();
  const trimmable=TOOLS.filter(t=>isOn(t)&&meta(t.name).tier==='optional'&&!t.calls&&t.tokens>0);
  const trimTok=trimmable.reduce((a,t)=>a+t.tokens,0);
  const pass=t=>S.filter==='all'||(S.filter==='on'&&isOn(t))||(S.filter==='off'&&!isOn(t))||(S.filter==='idle'&&isOn(t)&&!t.calls);

  const groups=GROUPS.map(g=>{
    const rows=TOOLS.filter(t=>meta(t.name).g===g.id).sort((a,b)=>b.tokens-a.tokens||a.name.localeCompare(b.name));
    return {...g,rows,shown:rows.filter(pass)};
  }).filter(g=>g.shown.length);

  return `
  <div class="phead"><div><div class="eyebrow">${TOOLS.filter(t=>isOn(t)).length} of ${TOOLS.length} tools enabled · ${fmt(TAX())} tok every turn</div><h1>Optimize</h1>
    <p class="sub">Tool schemas ship on every turn. Drop the ones nothing calls.</p>
  </div></div>

  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
    ${kpi('Enabled',onT.length+' <span style="font-size:15px;color:var(--ink3)">/ '+TOOLS.length+'</span>','','tools the agent can reach for','')}
    ${kpi('Shipping now',usd(project(TAX()).perMonth)+'<span style="font-size:15px;color:var(--ink3)">/mo</span>','',
      `${k(TAX())} tok every turn`,
      delta?`<span class="delta ${delta<0?'dn':'up'}">${delta<0?'−':'+'}${usd(Math.abs(project(delta).perMonth))}/mo</span>`:'')}
    ${kpi('On but unused',TOOLS.filter(t=>isOn(t)&&t.tokens>0&&!t.calls).length,'','shipped every turn, never called','')}
    ${kpi('Staged',pendCount(),'',pendCount()?'not written yet':'settings.json in sync','')}
  </div>

  ${(()=>{
    /* Monthly projection. Every figure is measured tokens × the measured input rate ×
       a turn count the user controls, and the basis is printed underneath. */
    const idle=TOOLS.filter(t=>isOn(t)&&t.tokens>0&&!t.calls);
    const idleTok=idle.reduce((a,t)=>a+t.tokens,0);
    const stagedTok=Object.keys(S.pending).reduce((a,n)=>{
      const t=TOOLS.find(x=>x.name===n); if(!t) return a;
      return a+(S.pending[n]===false?t.tokens:-t.tokens);   // off saves, on costs
    },0);
    const row=(lbl,tok,col,strong)=>{
      const p=project(tok);
      return `<tr${strong?' style="font-weight:700"':''}>
        <td>${lbl}</td>
        <td class="r mono">${tok?k(tok):'—'}</td>
        <td class="r mono"${col?` style="color:var(--${col})"`:''}>${tok?usd(p.perTurn):'—'}</td>
        <td class="r mono"${col?` style="color:var(--${col})"`:''}>${tok?usd(p.perDay):'—'}</td>
        <td class="r mono"${col?` style="color:var(--${col});font-size:15px"`:''}>${tok?usd(p.perMonth):'—'}</td></tr>`;
    };
    return `<div class="card" style="margin-bottom:14px">
      <div class="chead"><div><div class="ctitle">What tool schemas cost you a month</div>
        <div class="cnote" style="margin-top:3px">Schemas re-ship on every turn, so the only figure that matters is the recurring one.
          A bare <b class="mono">deny</b> drops the schema from context; a scoped deny may leave it visible.</div></div></div>
      <div class="tbl-scroll"><table class="tbl">
        <thead><tr><th>Tool schemas</th><th class="r" style="width:90px">Tokens</th>
          <th class="r" style="width:100px">Per turn</th><th class="r" style="width:100px">Per day</th>
          <th class="r" style="width:110px">Per month</th></tr></thead>
        <tbody>
          ${row('Shipping today',TAX_LIVE(),'',false)}
          ${pendCount()?row(`Staged change (${pendCount()} tool${pendCount()>1?'s':''})`,Math.abs(stagedTok),stagedTok>0?'jade':'rust',false):''}
          ${row(`Enabled but never called (${idle.length})`,idleTok,'jade',false)}
          ${row('After trimming every unused schema',Math.max(0,TAX()-idleTok),'',true)}
        </tbody>
      </table></div>
      <div class="cbody" style="border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:260px">
          <div style="font-weight:700;font-size:15px">${idle.length
            ? `Trim ${idle.length} unused schema${idle.length>1?'s':''} to save ${usd(project(idleTok).perMonth)} a month`
            : `Nothing idle — every schema that ships has been used`}</div>
          <div class="small muted" style="margin-top:3px">${trimmable.length
            ? `${trimmable.length} of them ${trimmable.length>1?'are':'is'} tagged optional and safe to drop first, worth ${usd(project(trimTok).perMonth)}/month.`
            : idle.length?`All of them are core or standard tools — review before trimming.`
            :`Every optional tool that still ships has been reached for.`}</div>
        </div>
        <button class="btn ${trimmable.length?'pri':''}" id="autoTrim" ${trimmable.length?'':'disabled'}>Stage ${trimmable.length} change${trimmable.length===1?'':'s'}</button>
      </div>
      <div class="cbody" style="border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2)">
        <span>Assume</span>
        <input id="projHours" type="number" min="0.5" max="24" step="0.5" value="${S.proj.hoursPerDay}"
          style="width:62px;padding:5px 7px;border:1px solid var(--line2);border-radius:7px;font:inherit;text-align:right">
        <span>hours of agent work a day ×</span>
        <input id="projDays" type="number" min="1" max="31" step="1" value="${S.proj.daysPerMonth}"
          style="width:56px;padding:5px 7px;border:1px solid var(--line2);border-radius:7px;font:inherit;text-align:right">
        <span>days a month</span>
        <span class="tag ${measuredRate()?'ok':'warn'} mono" style="margin-left:auto">${fmt(turnsPerMonth())} turns/mo</span>
      </div>
      <div class="cbody" style="border-top:1px solid var(--line);padding-top:10px">
        <div class="small muted">${projBasis()}. Cache-resident schemas keep billing until that cache expires, so a
        published change shows up on the next session rather than the next turn.</div>
      </div>
    </div>`;
  })()}

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
    <div class="segd" id="tfilter2">
      <button aria-selected="${S.filter==='all'}" data-f="all">All ${TOOLS.length}</button>
      <button aria-selected="${S.filter==='on'}" data-f="on">Shipping ${onT.length}</button>
      <button aria-selected="${S.filter==='off'}" data-f="off">Blocked ${TOOLS.length-onT.length}</button>
      <button aria-selected="${S.filter==='idle'}" data-f="idle">Never used</button>
    </div>
    <label style="display:flex;align-items:center;gap:9px;margin-left:auto;font-size:13.5px;color:var(--ink2);cursor:pointer">
      <button class="tog" role="switch" aria-checked="${S.unlockCore}" id="unlockCore"></button>
      Let me switch off core tools too</label>
  </div>

  ${groups.map(g=>{
    const gOn=g.rows.filter(isOn), gTok=gOn.reduce((a,t)=>a+t.tokens,0);
    return `<div class="card" style="margin-bottom:14px">
      <div class="chead" style="align-items:flex-start">
        <div style="flex:1"><div class="ctitle">${g.t}</div><div class="cnote" style="margin-top:3px;max-width:66ch">${g.s}</div></div>
        <div style="text-align:right;flex:none">
          <div class="mono" style="font-size:15px;font-weight:600">${usd(project(gTok).perMonth)}<span style="font-size:12px;color:var(--ink3)">/mo</span></div>
          <div class="cnote">${fmt(gTok)} tok/turn</div>
          <div class="cnote">${gOn.length} of ${g.rows.length} on</div></div>
      </div>
      <div class="tbl-scroll"><table class="tbl">
        <thead><tr><th style="width:60px"></th><th>Tool</th><th class="r" style="width:110px">Schema</th>
          <th class="r" style="width:86px">Calls</th><th class="r" style="width:118px">Per month</th><th style="width:150px">Status</th></tr></thead>
        <tbody>${g.shown.map(t=>{
          const m=meta(t.name), on=isOn(t), pend=S.pending[t.name]!==undefined;
          const locked=m.tier==='core'&&!S.unlockCore;
          const doc=DATA.docs&&DATA.docs[t.name];
          return `<tr>
            <td style="vertical-align:top"><button class="tog ${pend?'pend':''}" role="switch" aria-checked="${on}"
              data-tool="${esc(t.name)}" ${locked?'disabled':''} aria-label="${esc(t.name)}"></button></td>
            <td>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <b style="font-size:15px">${esc(t.name)}</b>
                <span class="tag ${TIER[m.tier].c}" title="${TIER[m.tier].h}">${locked?'🔒 ':''}${TIER[m.tier].t}</span>
                ${t.calls?`<span class="tag vio mono">used ${t.calls}×</span>`:''}
              </div>
              <div class="small muted" style="margin-top:3px;max-width:64ch">${esc(m.d)}</div>
              ${doc?`<button class="btn" style="height:26px;padding:0 9px;font-size:12.5px;margin-top:7px"
                data-doc="${esc(t.name)}">View the schema Iris captured</button>
                <div class="pre" id="doc-${esc(t.name)}" style="display:none;margin-top:7px">${esc(doc)}</div>`:''}
            </td>
            <td class="r mono" style="vertical-align:top">${t.tokens?fmt(t.tokens):'<span class="muted">not seen</span>'}</td>
            <td class="r mono ${t.calls?'':'muted'}" style="vertical-align:top">${t.calls||0}</td>
            <td class="r mono" style="vertical-align:top;color:${on&&t.tokens?'var(--ink)':'var(--ink3)'}">${on&&t.tokens?usd(project(t.tokens).perMonth):'—'}</td>
            <td style="vertical-align:top">${pend?`<span class="tag warn"><i class="dot-s"></i>staged ${on?'on':'off'}</span>`
                  : on?`<span class="tag ok"><i class="dot-s"></i>shipping</span>`
                      :`<span class="tag"><i class="dot-s"></i>blocked</span>`}</td></tr>`;
        }).join('')}</tbody></table></div></div>`;
  }).join('')}

  <p class="small muted" style="max-width:76ch">Blocked tools go into the <b class="mono">deny</b> list in <b class="mono">.claude/settings.json</b> and take effect on the agent's next session. Schemas sitting inside an already-cached prefix keep billing until that cache expires.<br><br>
  Schema sizes and call counts come from the recorded traffic. The one-line summaries are written by Iris; where the full schema text was captured off the wire you can open it on the row above.</p>`;
}
/* ═══════════════ VIEW · GUARD ═══════════════ */
function vGuard(){
  const env=GUARD.env;
  const prop=GUARD.proposal;
  const may=(prop&&prop.may)||(env?['modify current repository','use staging services','run local tools']:[]);
  const mayNot=(prop&&prop.mayNot)||['access production','use production credentials','destructive external ops'];
  const accepted=!!(env&&env.acceptedAt);
  const gDec=GUARD.decisions.filter(d=>!d.t||inWindow(d.t));
  const dCount=k=>gDec.filter(d=>String(d.decision||'').toLowerCase()===k).length;
  return `
  <div class="phead"><div>
    <div class="eyebrow">${env?.acceptedAt?'Envelope accepted':'No envelope accepted'} · ${dCount('allow')} allowed · ${dCount('ask')} asked · ${dCount('deny')} denied</div>
    <h1>Guard</h1>
    <p class="sub">What this task is allowed to do.</p>
  </div></div>
  <div class="split" style="margin-bottom:14px">
    <div class="card"><div class="chead"><div><div class="ctitle">This session may</div>
      <div class="cnote" style="margin-top:3px">The model can propose an envelope; it cannot widen one.
        Guard catches accidents and drift, not a model working around it.</div></div>
      <span class="tag ${accepted?'ok':'warn'}" style="margin-left:auto;align-self:flex-start">${accepted?'accepted':'not accepted'}</span></div>
      <div class="cbody">
        <div style="margin-bottom:10px"><label class="small muted">Task</label>
          <input id="guardTask" style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit"
            value="${esc(env?.task||prop?.summary?.task||'')}" placeholder="Fix staging authentication"></div>
        ${may.map(x=>`<div class="kv"><span>✓ ${esc(x)}</span></div>`).join('')}
        <div class="hr"></div>
        <div style="font-weight:600;margin:8px 0">It may not</div>
        ${mayNot.map(x=>`<div class="kv"><span>✕ ${esc(x)}</span></div>`).join('')}
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn pri" id="guardAccept" ${authBlocked()?'disabled':''}>${accepted?'Re-accept envelope':'Accept envelope'}</button>
          <button class="btn" id="guardPropose" ${authBlocked()?'disabled':''}>Regenerate proposal</button>
        </div>
        ${authBlocked()?'<div class="small muted" style="margin-top:8px">IRIS_UI_TOKEN is set. Open <span class="mono">/__monitor?iris_token=…</span> once.</div>':''}
      </div></div>
    <div class="card"><div class="chead"><div class="ctitle">Decisions</div>
      <span class="cnote" style="margin-left:auto">${gDec.filter(d=>String(d.decision||'').toLowerCase()==='allow').length} allow · ${gDec.filter(d=>String(d.decision||'').toLowerCase()==='ask').length} ask · ${gDec.filter(d=>String(d.decision||'').toLowerCase()==='deny').length} deny · ${esc(timeWindow().label)}</span></div>
      <div class="cbody">
        ${GUARD.signals.length?`<div class="tag warn" style="margin-bottom:10px">${GUARD.signals.length} trajectory signal(s)</div>
          ${GUARD.signals.slice(-5).map(s=>`<div class="small" style="margin-bottom:6px"><b>${esc(s.type)}</b> — ${esc(s.detail||'')}</div>`).join('')}`:
          '<div class="small muted" style="margin-bottom:10px">No active authority expansion.</div>'}
        ${gDec.length?gDec.slice(-30).reverse().map(d=>`
          <div class="kv"><span class="mono small">${esc(d.t||'').slice(11,19)} · ${esc(d.tool||'?')}</span>
            <b class="tag ${d.decision==='DENY'?'bad':d.decision==='ASK'?'warn':'ok'}">${esc(d.decision||'')}</b></div>
          <div class="small muted" style="margin:-4px 0 8px">${esc(d.reason||'')}</div>`).join(''):
          `<div class="empty">No PreToolUse decisions in ${esc(timeWindow().label.toLowerCase())}. ${GUARD.decisions.length?`Iris has ${fmt(GUARD.decisions.length)} recorded — try a wider range.`:'Run <b class="mono">npx @zero-drift/iris init</b> to install hooks.'}</div>`}
      </div></div>
  </div>`;
}

/* ═══════════════ VIEW · TRACE ═══════════════
   Thousands of actions accumulate, so this view never renders them all: it filters
   to a time window and a tool, then draws one page at a time. Each action is one
   line high — the description and the command both truncate, and a click expands
   the row you care about. */
const TRACE_PAGE=100;
const RISKY=/(^|\s)(rm|sudo|chmod|chown|kill|killall|dd|mkfs|shutdown|reboot)\s|>\s*\/|curl\s+[^|]*\|\s*(ba)?sh/;
function vTrace(){
  const win=traceWindow();
  const inWin=actionsIn(win);
  const tools=[...new Set(inWin.map(a=>a.tool))].sort();
  const rows=(S.tt==='all'?inWin:inWin.filter(a=>a.tool===S.tt)).slice().reverse();  // newest first
  const shown=rows.slice(0,S.tracePage*TRACE_PAGE);
  const risky=rows.filter(a=>RISKY.test(a.arg||'')).length;

  const hhmmss=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dayOf=t=>new Date(t).toLocaleDateString([], {month:'short',day:'numeric'});
  const stampFor=(a,prev)=>{
    const d=dayOf(a.t);
    return (!prev||dayOf(prev.t)!==d) ? `${d} ${hhmmss(a.t)}` : hhmmss(a.t);
  };

  return `
  <div class="phead"><div>
    <div class="eyebrow">${fmt(ACTS.total)} actions recorded${ACTS.list.length?` · since ${dayOf(ACTS.list[0].t)}`:''} · ${esc(win.label)}</div>
    <h1>Flight Recorder</h1>
    <p class="sub">What actually ran, and what Guard decided.</p>
  </div></div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <div class="segd" id="ttool">
      <button aria-selected="${S.tt==='all'}" data-t="all">All ${inWin.length}</button>
      ${tools.map(t=>`<button aria-selected="${S.tt===t}" data-t="${esc(t)}">${esc(t)} ${inWin.filter(a=>a.tool===t).length}</button>`).join('')}
    </div>

/* ═══════════════ toast / publish ═══════════════ */
function toast(msg,ok=true){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`${ok?'<span class="ok">✓</span>':'<span style="color:#FCA5A5">!</span>'}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t); setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateY(8px)';setTimeout(()=>t.remove(),300);},2600);
}
function syncPublish(){
  const n=pendCount(); $('#pubCnt').textContent=n; $('#publish').disabled=!n||publishing||authBlocked();
}
/* ── Publish · the only thing here that writes to disk ──────────────────────
   POSTs one tool at a time because that is the proxy's config API, then trusts
   the deny list the proxy reports back — the file is the source of truth, not
   this tab. A staged change that fails to write stays staged. */
let publishing=false;
async function publish(){
  const staged=Object.keys(S.pending);
  if(!staged.length||publishing) return;
  if(authBlocked()){ toast('IRIS_UI_TOKEN is required — open /__monitor?iris_token=…',false); return; }
  publishing=true;
  const btn=$('#publish'), label=btn.firstChild;
  btn.disabled=true; label.nodeValue='Publishing… ';

  const failed=new Map();
  let deny=null;
  for(const name of staged){
    try{
      const r=await fetch('/__config',{method:'POST',headers:irisHeaders(),
        body:JSON.stringify({tool:name,denied:S.pending[name]===false})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!Array.isArray(d.deny)) throw new Error(d.error||('HTTP '+r.status));
      deny=d.deny;
    }catch(err){ failed.set(name,err.message); }
  }

  publishing=false; label.nodeValue='Publish changes ';
  if(deny) applyDeny(deny);
  staged.forEach(n=>{ if(!failed.has(n)) delete S.pending[n]; });
  recalc(); render();

  const wrote=staged.length-failed.size;
  if(failed.size){
    const [n,msg]=[...failed][0];
    toast(`Wrote ${wrote} of ${staged.length} — ${esc(n)} failed: ${esc(msg)}`,false);
  }else{
    toast(`Published ${wrote} change${wrote>1?'s':''} — settings.json now denies ${LIVE.denySet.size} tools. Takes effect on the agent's next session.`);
  }
}
function toggleTool(name){
  const t=TOOLS.find(x=>x.name===name); if(!t) return;
  const next=!isOn(t);
  if(!next && meta(name).tier==='core' && !S.unlockCore){
    toast(`${name} is a core tool — turn on "switch off core tools" first`,false); return;
  }
  if(next===t.on) delete S.pending[name]; else S.pending[name]=next;
  syncPublish(); render();
  const d=next?0:t.tokens;
  toast(next?`${name} staged to ship again`:`${name} staged — ${fmt(t.tokens)} tokens off every turn`);
}

/* ═══════════════ command palette ═══════════════
   Rebuilt each time the palette opens, so it always offers the calls and tools
   Iris has seen — including ones that arrived a second ago. */
function buildCmds(){
  return [
    ...[['overview','Overview'],['spend','Spend'],['traffic','Traffic'],['context','Context'],['tools','Optimize'],['guard','Guard'],['trace','Flight Recorder']]
        .map(([v,lab])=>({t:'Go to '+lab,h:'view',run:()=>go(v)})),
    {t:'Publish staged policy changes',h:pendCount()?pendCount()+' staged':'nothing staged',run:()=>publish()},
    ...TOOLS.map(t=>({t:`What does ${t.name} do?`,h:meta(t.name).tier,run:()=>{go('tools');S.filter='all';render();}})),
    ...VW.slice().reverse().map(c=>({t:`Call ${c.id} · ${c.status==null?'in flight':usd(c.cost)} · ${ms(c.ms)}`,h:c.fromHist?'ledger':'call',
      run:()=>{go('traffic');setTimeout(()=>openCall(VW.findIndex(x=>(x.uid||x.id)===(c.uid||c.id))),40)}})),
    ...TOOLS.map(t=>({t:`Toggle ${t.name}`,h:`${fmt(t.tokens)} tok`,run:()=>{go('tools');toggleTool(t.name)}})),
    ...TRACE.slice(0,20).map(t=>({t:`Action ${t.i} · ${t.tool}`,h:'flight',run:()=>go('trace')})),
  ];
}

/* ═══════════════ router ═══════════════ */
const VIEWS={overview:vOverview,spend:vSpend,traffic:vTraffic,context:vContext,tools:vTools,guard:vGuard,trace:vTrace};
/* Before the first call lands there is genuinely nothing to show. Say so rather

function render(){
  const keep=$('#main').scrollTop;
  const standalone=S.view==='spend'||S.view==='trace'||S.view==='guard'||S.view==='tools';
  const hasWindow=VW.length>0||(S.view==='spend'&&HIST.records.length)||(S.view==='trace'&&ACTS.list.length);
  const hasAny=C.length||HIST.records.length||ACTS.list.length||standalone;
  const c=latestCall();
  $('#view').innerHTML=hasWindow||standalone?VIEWS[S.view]()
    : hasAny?vEmptyWindow()
    : vWaiting();
  $$('.nav').forEach(n=>n.setAttribute('aria-current',n.dataset.v===S.view?'page':'false'));
  paintTimeFilter();
  if(c&&!c.fromHist&&(S.view==='overview'||S.view==='context')) bindRibbon(c);
  if(VW.length&&S.view==='traffic') applyTrafficFilter();
  if(c&&!c.fromHist&&S.view==='context'){ loadContextDiff(); loadToolResults(); }
  $('#main').scrollTop=keep;
  syncPublish();
  syncStatus();
}
function loadContextDiff(){

    el.innerHTML=`<div class="kv"><span>Delta</span><b class="mono">${x.deltaTokens>=0?'+':''}${fmt(x.deltaTokens||0)} tok</b></div>

function go(v){ S.view=v; render(); $('#main').scrollTop=0; }
/* Row filters live on the rows themselves, so they must be re-applied after every
   re-render — otherwise a new call would silently ignore the active filter. */
function applyTrafficFilter(){
  const f=S.tf;
  $$('#tfilter button').forEach(b=>b.setAttribute('aria-selected',b.dataset.f===f));
  $$('#trows tr').forEach(r=>{
    const show=f==='all'||(f==='slow'&&r.dataset.slow==='1')||(f==='cold'&&r.dataset.cold==='1')||(f==='err'&&r.dataset.err==='1');
    r.style.display=show?'':'none';
    r.classList.toggle('sel',+r.dataset.call===S.sel);
  });
}

/* ═══════════════ events ═══════════════ */
document.addEventListener('click',e=>{
  const nav=e.target.closest('.nav'); if(nav) return go(nav.dataset.v);
  const goBtn=e.target.closest('[data-go]'); if(goBtn) return go(goBtn.dataset.go);
  const tog=e.target.closest('.tog'); if(tog&&tog.dataset.tool){ if(tog.disabled) return; return toggleTool(tog.dataset.tool); }
  const bar=e.target.closest('.bar'); if(bar) return openCall(+bar.dataset.call);
  const row=e.target.closest('#trows tr'); if(row) return openCall(+row.dataset.call);
  const acc=e.target.closest('.ahead'); if(acc) return acc.parentElement.classList.toggle('open');
  const ct=e.target.closest('[data-ct]');
  if(ct){ S.ctxTab=ct.dataset.ct; $('#main').scrollTop=0; return render(); }
  const f2=e.target.closest('#tfilter2 button'); if(f2){ S.filter=f2.dataset.f; return render(); }
  if(e.target.closest('#unlockCore')){ S.unlockCore=!S.unlockCore; render();
    return toast(S.unlockCore?'Core tools unlocked — be careful, the agent needs these':'Core tools protected again'); }
  const doc=e.target.closest('[data-doc]');
  if(doc){ const el=$('#doc-'+CSS.escape(doc.dataset.doc));
    const open=el.style.display!=='none'; el.style.display=open?'none':'block';
    doc.textContent=open?'View the schema Iris captured':'Hide schema'; return; }
  if(e.target.closest('#autoTrim')){
    const list=TOOLS.filter(t=>isOn(t)&&meta(t.name).tier==='optional'&&!t.calls&&t.tokens>0);
    if(!list.length) return;
    const tok=list.reduce((a,t)=>a+t.tokens,0);
    list.forEach(t=>{ if(t.on) S.pending[t.name]=false; else delete S.pending[t.name]; });
    syncPublish(); render();
    return toast(`${list.length} tools staged off — ${fmt(tok)} tokens a turn`);
  }
  const filt=e.target.closest('#tfilter button');
  if(filt){ S.tf=filt.dataset.f; return applyTrafficFilter(); }
  const tw=e.target.closest('#twin button');
  if(tw){ S.tw=tw.dataset.w; S.tracePage=1; twSave(); recalc(); return render(); }
  const tt=e.target.closest('#ttool button');
  if(tt){ S.tt=tt.dataset.t; S.tracePage=1; return render(); }
  if(e.target.closest('#traceMore')){ S.tracePage++; return render(); }
  if(e.target.closest('#traceAll')){ S.tracePage=1e9; return render(); }
  /* expand one row in place rather than re-rendering the list */
  const tr=e.target.closest('.tr');
  if(tr&&tr.dataset.act!==undefined) return tr.classList.toggle('open');
  const ci=e.target.closest('.ci'); if(ci){ closeK(); cmdShown[+ci.dataset.i].run(); return; }
  if(e.target.closest('#openK')) return openK();
  if(e.target.id==='cmdk') return closeK();
  if(e.target.closest('#dClose')||e.target.id==='scrim') return closeDrawer();
  if(e.target.closest('#dPrev')) return openCall(S.sel-1);
  if(e.target.closest('#dNext')) return openCall(S.sel+1);
  if(e.target.closest('#publish')) return publish();
  if(e.target.closest('#btnCtxDiff')) return loadContextDiff();
  if(e.target.closest('#btnToolRes')) return loadToolResults();
  if(e.target.closest('#guardPropose')){
    const task=$('#guardTask')?.value||'';
    return fetch('/__authority',{method:'POST',headers:irisHeaders(),
      body:JSON.stringify({action:'propose',task})}).then(r=>r.json()).then(d=>{
      GUARD.proposal=d; toast('Proposal regenerated'); render();
    }).catch(e=>toast(String(e.message||e),false));
  }
  if(e.target.closest('#guardAccept')){
    const task=$('#guardTask')?.value||'';
    return fetch('/__authority',{method:'POST',headers:irisHeaders(),
      body:JSON.stringify({action:'accept',task,envelope:GUARD.proposal?.envelope||GUARD.env||undefined})})
      .then(r=>r.json()).then(async d=>{
        if(!d.ok) throw new Error(d.error||'accept failed');
        await refreshGuard(); toast('Authority envelope accepted'); render();
      }).catch(e=>toast(String(e.message||e),false));
  }
});
document.addEventListener('keydown',e=>{
  const open=$('#cmdk').classList.contains('on');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); return open?closeK():openK(); }
  if(open){
    if(e.key==='Escape') return closeK();
    if(e.key==='ArrowDown'){e.preventDefault();return moveK(1)}
    if(e.key==='ArrowUp'){e.preventDefault();return moveK(-1)}
    if(e.key==='Enter'&&cmdShown[cmdIdx]){e.preventDefault();closeK();return cmdShown[cmdIdx].run()}
    return;
  }
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Escape') return closeDrawer();
  const dOpen=$('#drawer').classList.contains('on');
  if(dOpen&&e.key==='j') return openCall(S.sel+1);
  if(dOpen&&e.key==='k') return openCall(S.sel-1);
  const map={'1':'overview','2':'spend','3':'traffic','4':'context','5':'tools','6':'guard','7':'trace'};
  if(map[e.key]) return go(map[e.key]);
});
$('#cmdkIn').addEventListener('input',e=>renderCmd(e.target.value));

/* Projection assumptions live in the page, persist across reloads, and re-render
   every monthly figure at once. Delegated because the inputs are re-created on
   each render. */
document.addEventListener('change',e=>{
  const h=e.target.closest('#projHours'), d=e.target.closest('#projDays');
  if(!h&&!d) return;
  const v=parseFloat(e.target.value);
  if(!isFinite(v)||v<=0){ e.target.value=h?S.proj.hoursPerDay:S.proj.daysPerMonth; return; }
  if(h) S.proj.hoursPerDay=Math.min(24,v); else S.proj.daysPerMonth=Math.min(31,Math.round(v));
  projSave(); render();
});

/* ═══════════════ live wiring ═══════════════
   Nothing below invents a number. Iris draws what /__events reports and writes
   what /__config accepts; if the proxy stops, the UI says so. */
function syncStatus(){
  $('#envLabel').textContent=`${M.repo} · ${LIVE.connected?'recording':'proxy offline'}`;
  $('#pulse').classList.toggle('off',!LIVE.connected);
  const n=C.length, w=timeWindow();
  $('#railFoot').innerHTML=
    `Recording <b>proxy&nbsp;:${esc(String(LIVE.port??'—'))}</b><br>`+
    `${n} call${n===1?'':'s'} this session · ${VW.length} in ${esc(w.label.toLowerCase())}${LIVE.skipped?` · ${LIVE.skipped} skipped`:''}<br>`+
    `<span style="color:var(--${LIVE.connected?'jade':'rust'})">${LIVE.connected?'live stream':'stream down — retrying'}</span>`+
    `<br><button id="resetBtn" class="reset-link">Clear captured data</button>`;
}
$('#env').addEventListener('click',()=>location.reload());

/* Wipe the capture and start fresh. Delegated because the rail footer is
   re-rendered on every status sync. Confirmed with a blocking prompt rather
   than a toast-and-undo: the log files are gone once this runs. */
document.addEventListener('click',e=>{
  if(!e.target.closest('#resetBtn')) return;
  if(!confirm(
    'Clear all captured data?\n\n'+
    `\u2022 every request/response file in the capture folder\n`+
    `\u2022 the spend ledger (${fmt(HIST.records.length)} billable calls)\n`+
    `\u2022 the action log (${fmt(ACTS.list.length)} actions)\n`+
    `\u2022 Guard decisions\n\n`+
    'Your authority envelope and settings.json are kept.\n'+
    'This cannot be undone.'
  )) return;
  fetch('/__reset',{method:'POST',headers:{'content-type':'application/json'},
                    body:JSON.stringify({confirm:'clear'})})
    .then(async r=>{
      /* A 404 here means the page was served by an Iris build older than this
         route — the proxy is running fine, it just needs restarting. Saying
         "is the proxy running?" sends people looking in the wrong place. */
      if(r.status===404){ toast('This Iris process predates the reset route — restart Iris and try again',false); return null; }
      let d=null; try{ d=await r.json(); }catch(e){}
      if(!r.ok||!d||!d.ok){ toast((d&&d.error)||`Reset failed (HTTP ${r.status})`,false); return null; }
      return d;
    })
    .then(d=>{
      if(!d) return;
      toast(`Cleared ${fmt(d.files)} files · ${fmt(d.calls)} calls · ${fmt(d.actions)} actions`);
      setTimeout(()=>location.reload(),700);
    })
    .catch(()=>toast('Could not reach the proxy — is it still running?',false));
});

/* One render per burst: a single turn can deliver a request and its response
   within milliseconds, and the views rebuild their whole subtree. */
let renderTimer=null;
function scheduleRender(){
  if(renderTimer) return;
  renderTimer=setTimeout(()=>{
    renderTimer=null;
    recalc(); maybeRefreshDocs(); render();
    /* the inspector holds a snapshot — redraw it only if its call actually changed,
       so reading a completed call is never interrupted by later traffic */
    if($('#drawer').classList.contains('on')&&VW[S.sel]&&(VW[S.sel].updatedAt||0)!==drawerStamp) openCall(S.sel);
  },120);
}

/* A tool shipped that we hold no captured schema for — pull the docs again.
   Rate-limited so a tool the proxy genuinely cannot describe can't spin. */
function maybeRefreshDocs(){
  if(LIVE.docsBusy) return;
  if(Date.now()-(LIVE.docsAt||0)<5000) return;
  if(!TOOLS.some(t=>t.tokens>0&&!DATA.docs[t.name])) return;
  LIVE.docsBusy=true; LIVE.docsAt=Date.now();
  fetch('/__tooldocs').then(r=>r.json())
    .then(d=>{ applyToolDocs(d.tools); LIVE.docsBusy=false; recalc(); render(); })
    .catch(()=>{ LIVE.docsBusy=false; });
}

function connect(){
  const es=new EventSource('/__events');   // EventSource reconnects on its own
  es.onopen=()=>{ LIVE.connected=true; syncStatus(); };
  es.onerror=()=>{ LIVE.connected=false; syncStatus(); };
  es.onmessage=ev=>{
    let e; try{ e=JSON.parse(ev.data); }catch(err){ return; }
    LIVE.lastEventAt=Date.now();
    if(e.kind==='request'){ if(!ingestRequest(e)) return; }
    else if(e.kind==='response'){ if(!ingestResponse(e)) return; }
    else if(e.kind==='config'){ applyDeny(e.deny); }   // another tab published
    else if(e.kind==='authority'||e.kind==='guard'){ refreshGuard().then(()=>scheduleRender()); return; }
    else return;
    scheduleRender();
  };
}

async function boot(){
  const get=(u,fn)=>fetch(u).then(r=>r.json()).then(fn).catch(()=>{});
  await Promise.all([
    get('/__meta',d=>{
      LIVE.port=d.port; LIVE.upstream=d.upstream; LIVE.settingsPath=d.settingsPath;
      LIVE.authRequired=!!d.authRequired;
      M.session=d.session||M.session; M.repo=d.repo||M.repo; M.agent=d.agent||M.agent;
      document.title=`Iris — ${M.repo}`;
      if(authBlocked()) toast('IRIS_UI_TOKEN is required — open /__monitor?iris_token=…',false);
    }),
    get('/__config',d=>applyDeny(d.deny)),
    get('/__tooldocs',d=>{ applyToolDocs(d.tools); LIVE.docsAt=Date.now(); }),
    get('/__history',d=>{ HIST.records=d.records||[]; HIST.builtAt=d.builtAt; HIST.building=!!d.building; }),
    get('/__actions',d=>{ mergeActions(d.actions); ACTS.total=d.total||ACTS.list.length; ACTS.loaded=true; }),
    refreshGuard(),
  ]);
  recalc(); render();
  connect();
}
boot();

</script>
